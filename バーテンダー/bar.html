<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BAR 氷解</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="ber.css" rel="stylesheet" />
</head>
<body>
<div id="app">
  <div id="stage">
    <img id="bg" src="0.png" alt="scene">
    <div id="shade"></div>
    <div class="flash" id="flash"></div>
    <div id="topbar">
      <div class="brand"><div class="brand-main">BAR 氷解</div><div class="brand-sub">十問の夜</div></div>
      <div class="navbtns">
        <button class="mini" onclick="openModal('question')">問題</button>
        <button class="mini" onclick="openModal('log')">LOG</button>
        <button class="mini" onclick="openModal('cards')">実績</button>
        <button class="mini" onclick="openModal('menu')">MENU</button>
      </div>
    </div>
    <div id="scoreChip">問 <b id="qNow">0</b>/10　正解 <b id="scoreNow">0</b></div>
    <div id="choicePanel"></div>
    <div id="textbox" onclick="advance()">
      <div id="speaker">語り</div>
      <div id="text"></div>
      <div id="systemLine"></div>
      <div id="nextMark">▶</div>
    </div>
    <div id="titleLayer">
      <div class="titleBox">
        <div class="titlePre">仕事帰りの路地裏</div>
        <div class="titleMain">BAR 氷解</div>
        <div class="titleSub">お悩みもお酒も、氷を入れて……</div>
        <button class="primary" onclick="startIntro()">はじめる</button>
      </div>
    </div>
    <div id="modal"><div class="modalBox"><div class="modalHead"><div class="modalTitle" id="modalTitle">LOG</div><button class="modalClose" onclick="closeModal()">閉じる</button></div><div class="modalBody" id="modalBody"></div></div></div>
  </div>
</div>
<div id="rotate"><div><b>横画面推奨</b><br>このゲームは16:9のノベルゲーム画面で設計しています。<br>スマホでは横向きにすると、画像とテキストが崩れません。</div></div>
<script src="intro.js"></script>
<script src="q1.js"></script>
<script src="final.js"></script>
<script src="ber.js"></script>
</body>
</html>
