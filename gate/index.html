<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe7d4">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Shoot the horde, or grow the gates. The numbers never stop inflating.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GATE VADER">
  <title>GATE VADER</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Yuji+Syuku&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=0.21.0">
</head>
<body>
  <div id="stage">
    <canvas id="cv"></canvas>

    <!-- ホーム：上に通貨、下にタブ（中央がホーム）。左右スワイプでも切り替え -->
    <div class="home" id="home" hidden>
      <header class="h-bar">
        <button class="h-prof" id="hProf"><span class="h-ava"><img id="hAva" alt=""></span><span class="h-rank" id="hRank"></span>
          <span class="h-name"><b id="hName"></b><small id="hBest"></small></span></button>
        <div class="h-title" id="hTitle"></div>
        <div class="h-curs">
          <div class="h-cur"><i class="ic-zeni"></i><b id="hCoins">0</b><button class="plus" data-plus="coin">＋</button></div>
          <div class="h-cur"><i class="ic-pearl"></i><b id="hPearls">0</b><button class="plus" data-plus="pearl">＋</button></div>
        </div>
      </header>
      <div class="h-panels" id="hPanels">
        <!-- 記録 -->
        <section class="h-panel" id="p-rec">
          <div class="rec-stats" id="recStats"></div>
          <h3 class="h-sec" id="recHead"></h3>
          <div class="yokai" id="recYokai"></div>
        </section>
        <!-- 装備 -->
        <section class="h-panel" id="p-gear">
          <div class="seg no-swipe" id="gearSeg"><button data-k="weapon"></button><button data-k="skin"></button></div>
          <div class="gear-now" id="gearNow"></div>
          <div class="eq-list" id="gearList"></div>
        </section>
        <!-- ホーム -->
        <section class="h-panel" id="p-home">
          <div class="hm-scene" id="hmScene"></div>
          <div class="hm-road" id="hmRoad"></div>
          <div class="hm-side l" id="sideL"></div>
          <div class="hm-side r" id="sideR"></div>
          <button class="hm-croc" id="hmCrocBtn"><img id="hmCroc" alt=""><span class="hm-say" id="hmSay"></span></button>
          <div class="hm-plate" id="hmGear"></div>
          <div class="hm-bottom">
            <div class="round-wrap">
              <button class="chip-new" id="btnStartNew" hidden></button>
              <button class="round go" id="btnStart"><b></b><small></small></button>
            </div>
            <div class="banner" id="hmBanner"><div class="bn-track" id="bnTrack"></div><div class="bn-dots" id="bnDots"></div></div>
            <div class="round-wrap"><button class="round up" id="btnUp"><b></b><small></small><i class="dot" id="dotUp" hidden></i></button></div>
          </div>
        </section>
        <!-- ガチャ -->
        <section class="h-panel" id="p-gacha">
          <div class="seg no-swipe" id="gachaSeg"><button data-k="weapon"></button><button data-k="skin"></button></div>
          <div class="gp-title" id="gachaTitle"></div>
          <div class="gp-card" id="gachaPick"></div>
          <div class="gp-row">
            <button class="btn-line sm" id="btnLineup"></button>
            <div class="gp-pity" id="gachaPity"></div>
          </div>
          <div class="gp-pulls">
            <button class="btn-pull one" id="btnPull"></button>
            <button class="btn-pull ten" id="btnPull10"></button>
          </div>
          <div class="g-rates" id="gachaRates"></div>
          <div class="g-how" id="gachaHow"></div>
          <h3 class="h-sec" id="gachaListHead"></h3>
          <div class="g-list" id="gachaList"></div>
        </section>
        <!-- 設定 -->
        <section class="h-panel" id="p-opt">
          <div class="opt-list" id="optList"></div>
          <div class="opt-foot" id="optFoot"></div>
        </section>
      </div>
      <nav class="h-nav" id="hNav">
        <button data-tab="gear"><i>装</i><span></span><b class="dot" id="dotGear"></b></button>
        <button data-tab="gacha"><i>引</i><span></span><b class="dot" id="dotGacha"></b></button>
        <button data-tab="home" class="center"><i>鰐</i><span></span></button>
        <button data-tab="rec"><i>巻</i><span></span></button>
        <button data-tab="opt"><i>設</i><span></span></button>
      </nav>
    </div>

    <!-- タイトル：絵巻の一場面。タップではじめる -->
    <div class="title-screen" id="title" hidden>
      <div class="ts-scene" id="tsScene"></div>
      <div class="ts-ver" id="tsVer"></div>
      <button class="ts-menu" id="tsMenu" aria-label="menu"><i></i><i></i><i></i></button>
      <div class="ts-logo">GATE<br>VADER<span>鰐</span></div>
      <div class="ts-tap" id="tsTap"></div>
      <div class="ts-copy">© MASU01</div>
    </div>

    <!-- お知らせ・道のり など -->
    <div class="sheet" id="info" hidden>
      <div class="card tall">
        <div class="card-title" id="infoTitle"></div>
        <div class="info-body" id="infoBody"></div>
        <button class="btn-line" id="btnInfoClose"></button>
      </div>
    </div>

    <!-- 一時停止 -->
    <div class="sheet" id="pause" hidden>
      <div class="card">
        <div class="card-title" id="pauseTitle"></div>
        <button class="btn-go sm" id="btnResume"></button>
        <button class="btn-line" id="btnQuit"></button>
      </div>
    </div>

    <!-- 結果 -->
    <div class="sheet" id="result" hidden>
      <div class="card">
        <div class="card-title" id="resTitle"></div>
        <div class="res-m" id="resM"></div>
        <div class="res-sub" id="resSub"></div>
        <div class="res-get" id="resCoins"></div>
        <button class="btn-go sm" id="btnRetry"></button>
        <button class="btn-line" id="btnHome"></button>
      </div>
    </div>

    <!-- 遊び方 -->
    <div class="sheet" id="help" hidden>
      <div class="card tall">
        <div class="card-title" id="helpTitle"></div>
        <div class="help" id="helpBody"></div>
        <button class="btn-line" id="btnHelpClose"></button>
      </div>
    </div>

    <!-- チュートリアル -->
    <div id="tut" hidden>
      <div class="tut-head"><span id="tutStep">1 / 6</span><button id="tutSkip">SKIP</button></div>
      <p id="tutText"></p>
    </div>

    <div id="count" hidden></div>
    <div id="toast"></div>
  </div>

  <!-- 起動画面 -->
  <div class="boot" id="boot">
    <div class="boot-stage" id="bootStage"></div>
    <div class="boot-skip" id="bootSkip">TAP</div>
  </div>

  <script src="boot.js?v=0.21.0"></script>
  <script src="ink.js?v=0.21.0"></script>
  <script src="game.js?v=0.21.0"></script>
</body>
</html>
