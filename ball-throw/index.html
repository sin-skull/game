<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ボール投げ飛距離ゲーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,900;1,900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --black: #000;
        --white: #fff;
        --stage-w: min(100vw, calc(100dvh * 9 / 16));
        --stage-h: min(100dvh, calc(100vw * 16 / 9));
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--black);
        overflow: hidden;
        font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
        color: var(--white);
      }
      body {
        display: flex; align-items: center; justify-content: center;
        height: 100dvh;
      }
      button {
        font-family: inherit; cursor: pointer; min-height: 2.25rem;
        border: none; background: none; color: inherit; padding: 0;
      }
      .num { font-family: "Archivo", "Zen Kaku Gothic New", sans-serif; font-style: italic; font-weight: 900; }

      /* ---------- stage ---------- */
      #stage {
        position: relative;
        width: var(--stage-w);
        height: var(--stage-h);
        background: #000;
        border: 3px solid #fff;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        flex: none;
      }
      #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* ---------- top bar ---------- */
      #topbar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: stretch; gap: 8px;
        padding: 10px 10px 0;
        z-index: 20;
      }
      #coinbar {
        display: flex; align-items: center; gap: 8px;
        background: #000; border: 2px solid #fff;
        padding: 5px 12px 5px 7px;
        min-height: 2.5rem;
      }
      .coin-ic {
        width: 24px; height: 24px; flex: none;
        border: 3px solid #fff; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 900; font-style: normal;
        background: #000; color: #fff;
      }
      #coinVal { font-size: 22px; line-height: 1; letter-spacing: .02em; }
      #plusBtn {
        background: #fff; color: #000;
        font-weight: 900; font-size: 15px;
        padding: 0 14px; min-height: 2.5rem;
        border: 2px solid #fff;
        letter-spacing: .03em;
      }
      #plusBtn:active { background: #000; color: #fff; }
      #bestbar {
        margin-left: auto;
        background: #000; border: 2px solid #fff;
        padding: 5px 10px; text-align: right;
        display: flex; flex-direction: column; justify-content: center;
        min-height: 2.5rem;
      }
      #bestbar .lbl { font-size: 9px; font-weight: 900; letter-spacing: .22em; line-height: 1; }
      #bestVal { font-size: 17px; line-height: 1.1; }

      /* ---------- flight HUD ---------- */
      #hud {
        position: absolute; top: 15%; left: 0; right: 0;
        text-align: center; z-index: 15; pointer-events: none;
        display: none;
      }
      #hudDist { font-size: 64px; line-height: .95; text-shadow: 4px 4px 0 #000; }
      #hudDist small { font-size: 26px; }
      #hudEarn {
        display: inline-block; margin-top: 8px;
        background: #fff; color: #000;
        font-weight: 900; font-size: 16px; padding: 3px 12px;
      }

      /* ---------- select: tap hint + cards ---------- */
      #tapHint {
        position: absolute; left: 0; right: 0; bottom: 35%;
        text-align: center; z-index: 12; pointer-events: none;
        font-size: 27px; font-weight: 900; letter-spacing: .06em;
        text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        animation: hintPulse 1.1s steps(2, end) infinite;
      }
      @keyframes hintPulse { 50% { transform: translateY(5px); } }
      @media (prefers-reduced-motion: reduce) { #tapHint { animation: none; } }

      #cards {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; gap: 8px; padding: 10px;
        z-index: 20;
      }
      .card {
        flex: 1 1 0; min-width: 0;
        background: #fff; color: #000;
        border: 3px solid #fff;
        display: flex; flex-direction: column;
        outline: 2px solid #000; outline-offset: -5px;
      }
      .card .head {
        background: #000; color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 5px 8px;
      }
      .card .head .name { font-size: 13px; font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
      .card .head .lv {
        background: #fff; color: #000;
        font-size: 11px; font-weight: 900; padding: 1px 4px;
        font-family: "Archivo", sans-serif; font-style: italic;
        white-space: nowrap; flex: none;
      }
      .card .fx {
        text-align: center; font-weight: 900; font-size: 19px;
        padding: 9px 2px 2px; line-height: 1;
      }
      .card .fxsub { text-align: center; font-size: 10px; font-weight: 700; padding-bottom: 7px; letter-spacing: .08em; }
      .card .pips { display: flex; gap: 3px; padding: 0 8px 8px; }
      .card .pips i { flex: 1; height: 8px; background: #d9d9d9; display: block; }
      .card .pips i.on { background: #000; }
      .card .buy {
        margin-top: auto;
        background: #000; color: #fff;
        font-weight: 900; font-size: 16px;
        padding: 9px 4px; min-height: 2.75rem;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        border-top: 3px solid #fff;
        width: 100%;
      }
      .card .buy .coin-ic { width: 17px; height: 17px; border-width: 2px; font-size: 9px; }
      .card .buy:disabled { background: #8a8a8a; color: #000; cursor: default; }
      .card .buy:not(:disabled):active { background: #fff; color: #000; }

      /* ---------- aim UI ---------- */
      #aimUI { position: absolute; inset: 0; z-index: 18; display: none; pointer-events: none; }
      #backBtn {
        position: absolute; left: 10px; bottom: 12px;
        pointer-events: auto;
        background: #000; color: #fff; border: 2px solid #fff;
        font-weight: 900; font-size: 15px; padding: 10px 18px; min-height: 2.75rem;
      }
      #backBtn:active { background: #fff; color: #000; }
      #aimHint {
        position: absolute; left: 0; right: 0; bottom: 12%;
        text-align: center; font-weight: 900; font-size: 17px; letter-spacing: .1em;
        text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      }
      #gauge {
        position: absolute; right: 12px; bottom: 12px;
        width: 118px; pointer-events: none;
        background: #000; border: 2px solid #fff; padding: 8px 10px;
        display: none;
      }
      #gauge .row { display: flex; justify-content: space-between; align-items: baseline; }
      #gauge .k { font-size: 10px; font-weight: 900; letter-spacing: .18em; }
      #gauge .v { font-size: 21px; }
      #gauge .bar { height: 10px; border: 2px solid #fff; margin-top: 6px; }
      #gauge .bar i { display: block; height: 100%; background: #fff; width: 0%; }

      /* ---------- boost ---------- */
      #boostBtn {
        position: absolute; left: 12px; bottom: 14px; z-index: 22;
        width: 76px; height: 76px; border-radius: 50%;
        background: #fff; color: #000; border: 3px solid #000;
        outline: 3px solid #fff;
        display: none; align-items: center; justify-content: center; flex-direction: column;
        font-weight: 900;
      }
      #boostBtn svg { width: 34px; height: 34px; display: block; }
      #boostBtn .bt { font-size: 10px; letter-spacing: .08em; line-height: 1; margin-top: 1px; }
      #boostBtn.used { background: #555; color: #111; outline-color: #555; }
      #boostBtn:not(.used):active { transform: scale(.93); }

      /* ---------- result ---------- */
      #result {
        position: absolute; inset: 0; z-index: 30;
        display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.55);
        padding: 20px;
      }
      #resultPanel {
        background: #fff; color: #000; width: 100%; max-width: 320px;
        border: 3px solid #fff; outline: 2px solid #000; outline-offset: -6px;
        text-align: center;
      }
      #resultPanel .rhead {
        background: #000; color: #fff; font-weight: 900; font-size: 19px;
        letter-spacing: .34em; padding: 9px 0 9px .34em;
      }
      #resDist { font-size: 58px; line-height: 1; padding: 16px 0 0; }
      #resDist small { font-size: 24px; }
      #resNewBest {
        display: none; margin: 8px auto 0; width: fit-content;
        background: #000; color: #fff; font-weight: 900; font-size: 13px;
        padding: 3px 12px; letter-spacing: .14em;
      }
      #resCoins {
        font-weight: 900; font-size: 19px; padding: 12px 0 4px;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      #resCoins .coin-ic { border-color: #000; color: #000; background: #fff; }
      #resBest { font-size: 12px; font-weight: 700; padding-bottom: 14px; letter-spacing: .06em; }
      #okBtn {
        display: block; width: calc(100% - 24px); margin: 0 12px 14px;
        background: #000; color: #fff; font-weight: 900; font-size: 21px;
        letter-spacing: .3em; padding: 12px 0 12px .3em; min-height: 3.25rem;
        border: 3px solid #000;
      }
      #okBtn:active { background: #fff; color: #000; }

      #resetBtn {
        position: absolute; right: 10px; top: 64px; z-index: 25;
        font-size: 10px; font-weight: 700; letter-spacing: .12em;
        color: #fff; background: #000; border: 1px solid #fff;
        padding: 4px 8px; min-height: 2rem; display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="cv"></canvas>

      <div id="topbar">
        <div id="coinbar">
          <span class="coin-ic">C</span>
          <span id="coinVal" class="num">0</span>
        </div>
        <button id="plusBtn" type="button">+100000</button>
        <div id="bestbar">
          <span class="lbl">BEST</span>
          <span id="bestVal" class="num">0m</span>
        </div>
      </div>

      <div id="hud">
        <div id="hudDist" class="num">0<small>m</small></div>
        <div><span id="hudEarn">+0</span></div>
      </div>

      <div id="tapHint">タップでスタート</div>

      <div id="cards">
        <div class="card" id="card-catapult">
          <div class="head"><span class="name">カタパルト</span><span class="lv">Lv.1</span></div>
          <div class="fx num">0</div>
          <div class="fxsub">初速 km/h</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
        <div class="card" id="card-ball">
          <div class="head"><span class="name">ボール</span><span class="lv">Lv.1</span></div>
          <div class="fx num">0</div>
          <div class="fxsub">跳ね・転がり</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
        <div class="card" id="card-income">
          <div class="head"><span class="name">収入</span><span class="lv">Lv.1</span></div>
          <div class="fx num">×0</div>
          <div class="fxsub">コイン倍率</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
      </div>

      <div id="aimUI">
        <div id="aimHint">下に引っ張って 離す！</div>
        <button id="backBtn" type="button">← もどる</button>
        <div id="gauge">
          <div class="row"><span class="k">ANGLE</span><span class="v num" id="gAngle">0°</span></div>
          <div class="row"><span class="k">POWER</span><span class="v num" id="gPower">0%</span></div>
          <div class="bar"><i id="gBar"></i></div>
        </div>
      </div>

      <button id="boostBtn" type="button" aria-label="ブースト">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M12 2.5c3 2.6 4.5 6.2 4.5 10.2l-2.3 3.8h-4.4L7.5 12.7C7.5 8.7 9 5.1 12 2.5z" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="9.5" r="1.9" fill="#fff"/>
          <path d="M7.6 13.5 4.8 19l3.2-1.2M16.4 13.5 19.2 19l-3.2-1.2M10.4 20.2c.5 1 2.7 1 3.2 0l-.6-2.4h-2z" fill="currentColor" stroke="none"/>
        </svg>
        <span class="bt">BOOST</span>
      </button>

      <div id="result">
        <div id="resultPanel">
          <div class="rhead">RESULT</div>
          <div id="resDist" class="num">0<small>m</small></div>
          <div id="resNewBest">★ NEW RECORD ★</div>
          <div id="resCoins"><span class="coin-ic">C</span><span id="resCoinVal" class="num">+0</span></div>
          <div id="resBest">ベスト 0m</div>
          <button id="okBtn" type="button">OK</button>
        </div>
      </div>

      <button id="resetBtn" type="button">データ初期化</button>
    </div>

    <script>
      'use strict';
      /* ================= save (localStorage) ================= */
      var SAVE_KEY = 'ball-throw-github-v1';
      var save = { coins: 0, lv: { catapult: 1, ball: 1, income: 1 }, best: 0 };
      try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          var p = JSON.parse(raw);
          if (p && typeof p.coins === 'number') save.coins = p.coins;
          if (p && p.lv) {
            save.lv.catapult = p.lv.catapult | 0 || 1;
            save.lv.ball = p.lv.ball | 0 || 1;
            save.lv.income = p.lv.income | 0 || 1;
          }
          if (p && typeof p.best === 'number') save.best = p.best;
        }
      } catch (e) { /* storage unavailable: play without saving */ }
      function persist() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      }

      /* ================= upgrades ================= */
      function cost(kind) {
        var base = { catapult: 50, ball: 50, income: 60 }[kind];
        // gentle curve: each level costs only ~18% more than the last
        return Math.round(base * Math.pow(1.18, save.lv[kind] - 1) / 5) * 5;
      }
      function launchSpeed() { return 13 + save.lv.catapult * 2.6; }        // m/s at full power
      function bounceK() { return Math.min(0.78, 0.40 + save.lv.ball * 0.032); }
      function rollFriction() { return Math.max(0.85, 4.4 - save.lv.ball * 0.30); }
      // airtime stat: a stronger ball feels less gravity, so it stays up
      // longer and distance (= speed x airtime) stretches with it
      function gravK() { return Math.max(0.55, 1 - (save.lv.ball - 1) * 0.04); }
      function incomeMult() { return 1 + (save.lv.income - 1) * 0.5; }

      function fmt(n) {
        n = Math.floor(n);
        if (n >= 1e6) return trimNum(n / 1e6) + 'M';
        if (n >= 10000) return trimNum(n / 1000) + 'k';
        return String(n);
      }
      function trimNum(v) {
        var s = v.toFixed(2);
        return s.replace(/\.?0+$/, '');
      }

      /* ================= DOM ================= */
      var stage = document.getElementById('stage');
      var cv = document.getElementById('cv');
      var ctx = cv.getContext('2d');
      var coinVal = document.getElementById('coinVal');
      var bestVal = document.getElementById('bestVal');
      var hud = document.getElementById('hud');
      var hudDist = document.getElementById('hudDist');
      var hudEarn = document.getElementById('hudEarn');
      var tapHint = document.getElementById('tapHint');
      var cardsEl = document.getElementById('cards');
      var aimUI = document.getElementById('aimUI');
      var gauge = document.getElementById('gauge');
      var gAngle = document.getElementById('gAngle');
      var gPower = document.getElementById('gPower');
      var gBar = document.getElementById('gBar');
      var boostBtn = document.getElementById('boostBtn');
      var resultEl = document.getElementById('result');
      var resetBtn = document.getElementById('resetBtn');

      var W = 0, H = 0;
      function resize() {
        var r = stage.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = r.width; H = r.height;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dirty = true;
      }
      window.addEventListener('resize', resize);
      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

      /* ================= game state ================= */
      var GRAV = 9.8;
      var state = 'select'; // select | aim | fly | result
      var ball = { z: 0, y: 0, vz: 0, vy: 0, rolling: false, spin: 0 };
      var camZ = 0, camY = 0;
      var pull = null;      // {startY, r} while dragging in aim
      var boostUsed = false;
      var flightEarned = 0; // coins earned so far this flight (not yet committed until stop)
      var lastTs = 0;
      var dirty = true; // repaint only when something actually changed (flight = every frame)

      function pullAngle(r) { return (65 - 20 * r) * Math.PI / 180; }
      function pullSpeed(r) { return launchSpeed() * (0.30 + 0.70 * r); }

      function toAim() {
        state = 'aim';
        dirty = true;
        cardsEl.style.display = 'none';
        tapHint.style.display = 'none';
        resetBtn.style.display = 'none';
        aimUI.style.display = 'block';
        pull = null;
        gauge.style.display = 'none';
      }
      function toSelect() {
        state = 'select';
        dirty = true;
        ball.z = 0; ball.y = 0; ball.vz = 0; ball.vy = 0; ball.rolling = false;
        camZ = 0; camY = 0; pull = null; boostUsed = false; flightEarned = 0;
        cardsEl.style.display = 'flex';
        tapHint.style.display = 'block';
        resetBtn.style.display = 'block';
        aimUI.style.display = 'none';
        hud.style.display = 'none';
        boostBtn.style.display = 'none';
        resultEl.style.display = 'none';
        refreshUI();
      }
      function launch(r) {
        var a = pullAngle(r), v = pullSpeed(r);
        ball.vz = v * Math.cos(a);
        ball.vy = v * Math.sin(a);
        ball.z = 0; ball.y = 0; ball.rolling = false;
        boostUsed = false; flightEarned = 0;
        state = 'fly';
        aimUI.style.display = 'none';
        hud.style.display = 'block';
        boostBtn.style.display = 'flex';
        boostBtn.classList.remove('used');
      }
      function finishFlight() {
        var dist = ball.z;
        var earned = Math.floor(dist * incomeMult());
        save.coins += earned;
        var isBest = dist > save.best;
        if (isBest) save.best = dist;
        persist();
        state = 'result';
        hud.style.display = 'none';
        boostBtn.style.display = 'none';
        document.getElementById('resDist').innerHTML = fmt(dist) + '<small>m</small>';
        document.getElementById('resCoinVal').textContent = '+' + fmt(earned);
        document.getElementById('resBest').textContent = 'ベスト ' + fmt(save.best) + 'm';
        document.getElementById('resNewBest').style.display = isBest ? 'block' : 'none';
        resultEl.style.display = 'flex';
        refreshUI();
      }

      /* ================= physics ================= */
      function stepPhysics(dt) {
        if (state !== 'fly') return;
        var steps = Math.max(1, Math.ceil(dt / 0.0083));
        var h = dt / steps;
        for (var i = 0; i < steps; i++) {
          if (ball.rolling) {
            ball.vz -= rollFriction() * h;
            if (ball.vz <= 0) { ball.vz = 0; break; }
            ball.z += ball.vz * h;
          } else {
            ball.vy -= GRAV * gravK() * h;
            ball.z += ball.vz * h;
            ball.y += ball.vy * h;
            if (ball.y <= 0) {
              ball.y = 0;
              if (Math.abs(ball.vy) < 2.3) {
                ball.rolling = true; ball.vy = 0;
              } else {
                ball.vy = -ball.vy * bounceK();
                ball.vz *= 0.90;
              }
            }
          }
        }
        ball.spin += ball.vz * dt * 1.6;
        // camera chases the ball
        var targetZ = Math.max(0, ball.z - 7);
        camZ += (targetZ - camZ) * Math.min(1, dt * 10);
        if (state === 'fly' && ball.z - camZ < 6) camZ = Math.max(0, ball.z - 7);
        var targetY = Math.max(0, ball.y - 3.5) * 0.72;
        camY += (targetY - camY) * Math.min(1, dt * 5);
        flightEarned = Math.floor(ball.z * incomeMult());
        hudDist.innerHTML = fmt(ball.z) + '<small>m</small>';
        hudEarn.textContent = '+' + fmt(flightEarned);
        coinVal.textContent = fmt(save.coins + flightEarned);
        if (ball.rolling && ball.vz <= 0.01) finishFlight();
      }

      /* ================= rendering ================= */
      var HORIZON = 0.34;   // fraction of H
      var FOCAL = 8;        // m
      var CAMH = 1.2;       // m
      function unit() { return H * 0.55; }
      function yUnit() { return H * 0.13; }
      function persp(relZ) { return FOCAL / (FOCAL + Math.max(0, relZ)); }
      function groundY(relZ) {
        var p = persp(relZ);
        // camY (camera tilting up after a high ball) shifts the world down
        // at the same vertical scale the ball rises with, so the ball's net
        // height above its ground anchor is (ball.y - camY).
        return H * HORIZON + CAMH * p * unit() + camY * p * yUnit();
      }
      function roadHalfW(relZ) { return 3.1 * persp(relZ) * unit(); } // road half width 3.1m
      function screenX(relZ, wx) { return W / 2 + wx * persp(relZ) * unit(); }

      // deterministic tree placement
      function treeAt(i) {
        var h1 = Math.sin(i * 127.1) * 43758.5453;
        var frac = h1 - Math.floor(h1);
        var side = i % 2 === 0 ? -1 : 1;
        return { z: i * 13 + frac * 6, x: side * (5.6 + frac * 3.4), w: 0.34 + frac * 0.22 };
      }

      function drawScene() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        var horizonY = H * HORIZON;
        var farZ = 150;

        /* ----- road (gray, dark far -> light near) ----- */
        var x0L = screenX(0, -3.1), x0R = screenX(0, 3.1), y0 = groundY(0);
        var xFL = screenX(farZ, -3.1), xFR = screenX(farZ, 3.1), yF = groundY(farZ);
        var grad = ctx.createLinearGradient(0, yF, 0, y0);
        grad.addColorStop(0, '#242424');
        grad.addColorStop(0.55, '#555');
        grad.addColorStop(1, '#9a9a9a');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x0L, y0); ctx.lineTo(x0R, y0); ctx.lineTo(xFR, yF); ctx.lineTo(xFL, yF);
        ctx.closePath(); ctx.fill();

        /* ----- distance markings on the road ----- */
        var startM = Math.floor(camZ / 10) * 10;
        ctx.textAlign = 'left';
        for (var m = startM; m < camZ + farZ; m += 10) {
          if (m <= 0) continue;
          var rel = m - camZ;
          if (rel < 0.4) continue;
          var p = persp(rel);
          var gy = groundY(rel);
          var hw = roadHalfW(rel);
          var big = m % 50 === 0;
          if (!big && rel > 90) continue;
          ctx.strokeStyle = big ? '#fff' : 'rgba(255,255,255,' + Math.min(0.75, 0.25 + p) + ')';
          ctx.lineWidth = big ? Math.max(2, 5 * p) : Math.max(1, 2.2 * p);
          ctx.beginPath();
          ctx.moveTo(W / 2 - hw, gy); ctx.lineTo(W / 2 + hw, gy);
          ctx.stroke();
          if (big) {
            // label centered on the near side of the line: always fully
            // on the road surface, readable at any distance
            var fs = Math.max(10, 30 * p);
            ctx.fillStyle = '#fff';
            ctx.font = 'italic 900 ' + fs + 'px Archivo, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(m + 'm', W / 2, gy + fs * 1.15);
            ctx.textAlign = 'left';
          }
        }

        // start checker band
        if (camZ < 4) {
          var rel0 = 0 - camZ;
          var gy0 = groundY(Math.max(0, rel0));
          var hw0 = roadHalfW(Math.max(0, rel0));
          var sq = hw0 / 4;
          for (var s = 0; s < 8; s++) {
            ctx.fillStyle = s % 2 === 0 ? '#fff' : '#000';
            ctx.fillRect(W / 2 - hw0 + s * sq, gy0 - sq * 0.5, sq, sq * 0.5);
          }
        }

        /* ----- road edge pinstripes (white) ----- */
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(2, W * 0.008);
        ctx.beginPath(); ctx.moveTo(x0L, y0); ctx.lineTo(xFL, yF); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0R, y0); ctx.lineTo(xFR, yF); ctx.stroke();
        // center dashes
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = Math.max(1, 3 * persp(6));
        var dashStart = Math.floor(camZ / 6) * 6;
        for (var d = dashStart; d < camZ + 60; d += 6) {
          var r1 = d - camZ, r2 = d + 2.6 - camZ;
          if (r2 < 0.5) continue;
          ctx.beginPath();
          ctx.moveTo(W / 2, groundY(Math.max(0.5, r1)));
          ctx.lineTo(W / 2, groundY(Math.max(0.6, r2)));
          ctx.stroke();
        }

        /* ----- trees: leafless gray trunks to the top ----- */
        var i0 = Math.max(0, Math.floor((camZ - 4) / 13) - 1);
        var i1 = Math.floor((camZ + farZ) / 13) + 1;
        var trees = [];
        for (var i = i0; i <= i1; i++) {
          var t = treeAt(i);
          var relT = t.z - camZ;
          if (relT < -3 || relT > farZ) continue;
          trees.push({ t: t, rel: relT });
        }
        trees.sort(function (a, b) { return b.rel - a.rel; }); // far first
        for (var k = 0; k < trees.length; k++) {
          var tr = trees[k].t, relK = trees[k].rel;
          var pk = persp(Math.max(0, relK));
          var tx = screenX(Math.max(0, relK), tr.x);
          var tBase = groundY(Math.max(0, relK));
          var tw = Math.max(2, tr.w * pk * unit());
          // trunk: straight to above the top of the screen
          ctx.fillStyle = '#6f6f6f';
          ctx.fillRect(tx - tw / 2, -60, tw, tBase + 60);
          // white rim light on the inner edge
          ctx.fillStyle = '#e8e8e8';
          var rimX = tr.x < 0 ? tx + tw / 2 - Math.max(1, tw * 0.22) : tx - tw / 2;
          ctx.fillRect(rimX, -60, Math.max(1, tw * 0.22), tBase + 60);
          // dark bands
          ctx.fillStyle = '#3d3d3d';
          var bandStep = 1.7; // m
          for (var hb = bandStep; hb < 60; hb += bandStep) {
            var by = tBase - hb * pk * yUnit();
            if (by < -70) break;
            var bh = Math.max(1.5, 0.16 * pk * yUnit());
            ctx.fillRect(tx - tw / 2, by, tw, bh);
          }
        }

        /* ----- catapult (visible near start) ----- */
        var drawCatapult = camZ < 8;
        if (drawCatapult && ball.z < 9) {
          var relC = Math.max(0, 7 - camZ);
          var pc = persp(relC);
          var cxp = W / 2, cBase = groundY(relC);
          var postH = 0.95 * pc * yUnit() * 1.9;
          var postW = Math.max(3, 0.13 * pc * unit());
          var spread = 0.52 * pc * unit();
          ctx.fillStyle = '#000';
          // base slab
          ctx.fillRect(cxp - spread - postW, cBase - postW * 0.8, (spread + postW) * 2, postW * 0.8);
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          ctx.strokeRect(cxp - spread - postW, cBase - postW * 0.8, (spread + postW) * 2, postW * 0.8);
          // posts
          ctx.fillRect(cxp - spread - postW / 2, cBase - postH, postW, postH);
          ctx.fillRect(cxp + spread - postW / 2, cBase - postH, postW, postH);
          // band to the ball rest point
          var restY = cBase - postH - 0.30 * pc * unit() * 0.34;
          ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, postW * 0.5);
          ctx.beginPath();
          ctx.moveTo(cxp - spread, cBase - postH);
          ctx.lineTo(cxp, restY + 4);
          ctx.lineTo(cxp + spread, cBase - postH);
          ctx.stroke();
        }

        /* ----- dotted trajectory guide (aim) ----- */
        if (state === 'aim' && pull && pull.r > 0.03) {
          var a = pullAngle(pull.r), v = pullSpeed(pull.r);
          var vz = v * Math.cos(a), vy = v * Math.sin(a);
          var gz = 0, gy2 = 0.55, dt = 0.055;
          ctx.fillStyle = '#fff';
          for (var s2 = 0; s2 < 46; s2++) {
            vy -= GRAV * gravK() * dt;
            gz += vz * dt; gy2 += vy * dt;
            if (gy2 < 0) break;
            var relG = gz + 7 - camZ;
            var pg = persp(relG);
            var sx = W / 2;
            var sy = groundY(relG) - gy2 * pg * yUnit();
            // guide starts at the ball rest height
            var rDot = Math.max(1.6, 0.075 * pg * unit());
            ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2); ctx.fill();
          }
        }

        /* ----- ball shadow ----- */
        var ballRelZ = Math.max(0.5, (ball.z - camZ) + 7);
        var pb = persp(ballRelZ);
        var bx = W / 2;
        var bGroundY = groundY(ballRelZ);
        var ballR = Math.max(4, 0.27 * pb * unit());
        // rest offset: when z=0 the ball sits on the catapult (raised)
        var restLift = (state === 'select' || state === 'aim') ? ballR * 0.55 : 0;
        var by = bGroundY - ball.y * pb * yUnit() - ballR - restLift;
        var shadowScale = Math.max(0.25, 1 - ball.y * 0.03);
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.beginPath();
        ctx.ellipse(bx, bGroundY + ballR * 0.25, ballR * 1.05 * shadowScale, ballR * 0.30 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        /* ----- ball ----- */
        var squash = pull && state === 'aim' ? 1 - pull.r * 0.18 : 1;
        ctx.save();
        ctx.translate(bx, by);
        ctx.scale(1 / squash, squash);
        ctx.beginPath(); ctx.arc(0, 0, ballR, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.lineWidth = Math.max(2, ballR * 0.14); ctx.strokeStyle = '#000'; ctx.stroke();
        // rotating seam
        ctx.save();
        ctx.rotate(ball.spin % (Math.PI * 2));
        ctx.beginPath(); ctx.arc(0, 0, ballR * 0.62, 0.3, Math.PI - 0.3);
        ctx.lineWidth = Math.max(1.5, ballR * 0.13); ctx.strokeStyle = '#000'; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, ballR * 0.62, Math.PI + 0.3, Math.PI * 2 - 0.3);
        ctx.stroke();
        ctx.restore();
        // highlight dot
        ctx.beginPath(); ctx.arc(-ballR * 0.34, -ballR * 0.38, ballR * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = '#000'; ctx.fill();
        ctx.restore();

        // horizon hairline (keeps far road readable against black)
        ctx.fillStyle = 'rgba(255,255,255,.28)';
        ctx.fillRect(0, groundY(farZ), W, 1);
      }

      /* ================= loop ================= */
      function frame(ts) {
        if (!lastTs) lastTs = ts;
        var dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        stepPhysics(dt);
        // in select/aim the camera relaxes home
        if (state === 'select' || state === 'aim') { camZ = 0; camY = 0; }
        if (state === 'fly' || dirty) { drawScene(); dirty = false; }
        requestAnimationFrame(frame);
      }

      /* ================= UI refresh ================= */
      var cardDefs = [
        { kind: 'catapult', fx: function () { return Math.round(launchSpeed() * 3.6); } },
        { kind: 'ball', fx: function () { return (bounceK() * 100).toFixed(0) + '%'; } },
        { kind: 'income', fx: function () { return '×' + trimNum(incomeMult()); } }
      ];
      function refreshUI() {
        coinVal.textContent = fmt(save.coins);
        bestVal.textContent = fmt(save.best) + 'm';
        cardDefs.forEach(function (d) {
          var card = document.getElementById('card-' + d.kind);
          card.querySelector('.lv').textContent = 'Lv.' + save.lv[d.kind];
          card.querySelector('.fx').textContent = d.fx();
          if (d.kind === 'ball') {
            card.querySelector('.fxsub').textContent = '跳ね・転がり・滞空 ×' + trimNum(1 / gravK());
          }
          var c = cost(d.kind);
          card.querySelector('.cost').textContent = fmt(c);
          card.querySelector('.buy').disabled = save.coins < c;
          var pips = card.querySelector('.pips');
          if (!pips.children.length) {
            for (var i = 0; i < 5; i++) pips.appendChild(document.createElement('i'));
          }
          var on = ((save.lv[d.kind] - 1) % 5) + 1;
          for (var j = 0; j < 5; j++) pips.children[j].className = j < on ? 'on' : '';
        });
      }

      /* ================= input ================= */
      cardDefs.forEach(function (d) {
        var btn = document.querySelector('#card-' + d.kind + ' .buy');
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var c = cost(d.kind);
          if (save.coins < c) return;
          save.coins -= c;
          save.lv[d.kind] += 1;
          persist();
          refreshUI();
        });
      });

      document.getElementById('plusBtn').addEventListener('click', function (ev) {
        ev.stopPropagation();
        save.coins += 100000;
        persist();
        refreshUI();
      });
      document.getElementById('backBtn').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (state === 'aim') toSelect();
      });
      document.getElementById('okBtn').addEventListener('click', function () { toSelect(); });
      boostBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (state !== 'fly' || boostUsed) return;
        boostUsed = true;
        boostBtn.classList.add('used');
        ball.vz *= 1.32;
        if (ball.rolling) { ball.rolling = false; ball.vy = 8.5; }
        else ball.vy = Math.max(ball.vy, 0) + 6.5;
      });
      var resetArmed = false;
      resetBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!resetArmed) {
          resetArmed = true;
          resetBtn.textContent = '本当に初期化？';
          setTimeout(function () { resetArmed = false; resetBtn.textContent = 'データ初期化'; }, 2600);
          return;
        }
        save = { coins: 0, lv: { catapult: 1, ball: 1, income: 1 }, best: 0 };
        persist();
        resetArmed = false;
        resetBtn.textContent = 'データ初期化';
        refreshUI();
      });

      // tap (select -> aim) + pull (aim)
      var tapTrack = null;
      stage.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button') || e.target.closest('.card') || e.target.closest('#topbar')) return;
        if (state === 'select') {
          tapTrack = { x: e.clientX, y: e.clientY, t: performance.now() };
        } else if (state === 'aim') {
          pull = { startY: e.clientY, r: 0 };
          dirty = true;
          stage.setPointerCapture(e.pointerId);
        }
      });
      stage.addEventListener('pointermove', function (e) {
        if (state === 'aim' && pull) {
          var rect = stage.getBoundingClientRect();
          var maxPull = rect.height * 0.34;
          var dy = e.clientY - pull.startY;
          pull.r = Math.max(0, Math.min(1, dy / maxPull));
          dirty = true;
          if (pull.r > 0.02) {
            gauge.style.display = 'block';
            gAngle.textContent = Math.round(65 - 20 * pull.r) + '°';
            gPower.textContent = Math.round(pull.r * 100) + '%';
            gBar.style.width = (pull.r * 100) + '%';
          } else {
            gauge.style.display = 'none';
          }
        }
      });
      function endPointer(e) {
        if (state === 'select' && tapTrack) {
          var moved = Math.hypot(e.clientX - tapTrack.x, e.clientY - tapTrack.y);
          if (moved < 14 && performance.now() - tapTrack.t < 600) toAim();
          tapTrack = null;
        } else if (state === 'aim' && pull) {
          var r = pull.r;
          pull = null;
          gauge.style.display = 'none';
          dirty = true;
          if (r > 0.10) launch(r);
        }
      }
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', function () {
        tapTrack = null;
        if (state === 'aim') { pull = null; gauge.style.display = 'none'; dirty = true; }
      });
      // block context menu / scroll gestures on the stage
      stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      /* ================= boot ================= */
      resize();
      requestAnimationFrame(function () { resize(); });
      toSelect();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
