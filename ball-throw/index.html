<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ボール投げ飛距離ゲーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,900;1,900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --black: #000;
        --white: #fff;
        --stage-w: min(100vw, calc(100dvh * 9 / 16));
        --stage-h: min(100dvh, calc(100vw * 16 / 9));
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--black);
        overflow: hidden;
        font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
        color: var(--white);
      }
      body {
        display: flex; align-items: center; justify-content: center;
        height: 100dvh;
      }
      button {
        font-family: inherit; cursor: pointer; min-height: 2.25rem;
        border: none; background: none; color: inherit; padding: 0;
      }
      .num { font-family: "Archivo", "Zen Kaku Gothic New", sans-serif; font-style: italic; font-weight: 900; }

      /* ---------- stage ---------- */
      #stage {
        position: relative;
        width: var(--stage-w);
        height: var(--stage-h);
        background: #000;
        border: 3px solid #fff;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        flex: none;
      }
      #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* ---------- top bar ---------- */
      #topbar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: stretch; gap: 8px;
        padding: 10px 10px 0;
        z-index: 20;
      }
      #coinbar {
        display: flex; align-items: center; gap: 8px;
        background: #000; border: 2px solid #fff;
        padding: 5px 12px 5px 7px;
        min-height: 2.5rem;
      }
      .coin-ic {
        width: 24px; height: 24px; flex: none;
        border: 3px solid #fff; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 900; font-style: normal;
        background: #000; color: #fff;
      }
      #coinVal { font-size: 22px; line-height: 1; letter-spacing: .02em; }
      #plusBtn {
        background: #fff; color: #000;
        font-weight: 900; font-size: 15px;
        padding: 0 14px; min-height: 2.5rem;
        border: 2px solid #fff;
        letter-spacing: .03em;
      }
      #plusBtn:active { background: #000; color: #fff; }
      #bestbar {
        margin-left: auto;
        background: #000; border: 2px solid #fff;
        padding: 5px 10px; text-align: right;
        display: flex; flex-direction: column; justify-content: center;
        min-height: 2.5rem;
      }
      #bestbar .lbl { font-size: 9px; font-weight: 900; letter-spacing: .22em; line-height: 1; }
      #bestVal { font-size: 17px; line-height: 1.1; }

      /* ---------- flight HUD ---------- */
      #hud {
        position: absolute; top: 15%; left: 0; right: 0;
        text-align: center; z-index: 15; pointer-events: none;
        display: none;
      }
      #hudDist { font-size: 64px; line-height: .95; text-shadow: 4px 4px 0 #000; }
      #hudDist small { font-size: 26px; }
      #hudStats {
        margin-top: 10px;
        display: flex; gap: 8px; justify-content: center;
      }
      .hstat {
        background: #000; border: 2px solid #fff;
        padding: 4px 12px 6px; min-width: 96px;
      }
      .hstat .k { display: block; font-size: 9px; font-weight: 900; letter-spacing: .24em; line-height: 1.2; }
      .hstat .v { font-size: 21px; line-height: 1.1; }
      .hstat .v small { font-size: 12px; }
      #ffTag {
        display: none; margin-top: 8px;
        background: #fff; color: #000;
        font-weight: 900; font-size: 14px; letter-spacing: .14em;
        padding: 3px 12px;
      }

      /* ---------- select: tap hint + cards ---------- */
      #tapHint {
        position: absolute; left: 0; right: 0; bottom: 35%;
        text-align: center; z-index: 12; pointer-events: none;
        font-size: 27px; font-weight: 900; letter-spacing: .06em;
        text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        animation: hintPulse 1.1s steps(2, end) infinite;
      }
      @keyframes hintPulse { 50% { transform: translateY(5px); } }
      @media (prefers-reduced-motion: reduce) { #tapHint { animation: none; } }

      #cards {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; gap: 8px; padding: 10px;
        z-index: 20;
      }
      .card {
        flex: 1 1 0; min-width: 0;
        background: #fff; color: #000;
        border: 3px solid #fff;
        display: flex; flex-direction: column;
        outline: 2px solid #000; outline-offset: -5px;
      }
      .card .head {
        background: #000; color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 5px 8px;
      }
      .card .head .name { font-size: 13px; font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
      .card .head .lv {
        background: #fff; color: #000;
        font-size: 11px; font-weight: 900; padding: 1px 4px;
        font-family: "Archivo", sans-serif; font-style: italic;
        white-space: nowrap; flex: none;
      }
      .card .fx {
        text-align: center; font-weight: 900; font-size: 19px;
        padding: 9px 2px 2px; line-height: 1;
      }
      .card .fxsub { text-align: center; font-size: 10px; font-weight: 700; padding-bottom: 7px; letter-spacing: .08em; }
      .card .pips { display: flex; gap: 3px; padding: 0 8px 8px; }
      .card .pips i { flex: 1; height: 8px; background: #d9d9d9; display: block; }
      .card .pips i.on { background: #000; }
      .card .buy {
        margin-top: auto;
        background: #000; color: #fff;
        font-weight: 900; font-size: 16px;
        padding: 9px 4px; min-height: 2.75rem;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        border-top: 3px solid #fff;
        width: 100%;
      }
      .card .buy .coin-ic { width: 17px; height: 17px; border-width: 2px; font-size: 9px; }
      .card .buy:disabled { background: #8a8a8a; color: #000; cursor: default; }
      .card .buy:not(:disabled):active { background: #fff; color: #000; }

      /* ---------- aim UI ---------- */
      #aimUI { position: absolute; inset: 0; z-index: 18; display: none; pointer-events: none; }
      #backBtn {
        position: absolute; left: 10px; bottom: 12px;
        pointer-events: auto;
        background: #000; color: #fff; border: 2px solid #fff;
        font-weight: 900; font-size: 15px; padding: 10px 18px; min-height: 2.75rem;
      }
      #backBtn:active { background: #fff; color: #000; }
      #aimHint {
        position: absolute; left: 0; right: 0; bottom: 12%;
        text-align: center; font-weight: 900; font-size: 17px; letter-spacing: .1em;
        text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      }
      #gauge {
        position: absolute; right: 12px; bottom: 12px;
        width: 118px; pointer-events: none;
        background: #000; border: 2px solid #fff; padding: 8px 10px;
        display: none;
      }
      #gauge .row { display: flex; justify-content: space-between; align-items: baseline; }
      #gauge .k { font-size: 10px; font-weight: 900; letter-spacing: .18em; }
      #gauge .v { font-size: 21px; }
      #gauge .bar { height: 10px; border: 2px solid #fff; margin-top: 6px; }
      #gauge .bar i { display: block; height: 100%; background: #fff; width: 0%; }

      /* ---------- boost ---------- */
      #boostBtn {
        position: absolute; left: 12px; bottom: 14px; z-index: 22;
        width: 76px; height: 76px; border-radius: 50%;
        background: #fff; color: #000; border: 3px solid #000;
        outline: 3px solid #fff;
        display: none; align-items: center; justify-content: center; flex-direction: column;
        font-weight: 900;
      }
      #boostBtn svg { width: 34px; height: 34px; display: block; }
      #boostBtn .bt { font-size: 10px; letter-spacing: .08em; line-height: 1; margin-top: 1px; }
      #boostBtn.used { background: #555; color: #111; outline-color: #555; }
      #boostBtn.on { background: #000; color: #fff; transform: scale(.93); }
      #boostBtn { touch-action: none; }
      /* the black ring just inside the white button face IS the gauge:
         full = the ring closes the whole circle; holding BOOST burns it
         and the ring is consumed clockwise until nothing is left */
      #boostBtn svg.ring {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
      }
      #boostBtn.on #boostRing { stroke: #fff; }

      /* ---------- result ---------- */
      #result {
        position: absolute; inset: 0; z-index: 30;
        display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.55);
        padding: 20px;
      }
      #resultPanel {
        background: #fff; color: #000; width: 100%; max-width: 320px;
        border: 3px solid #fff; outline: 2px solid #000; outline-offset: -6px;
        text-align: center;
      }
      #resultPanel .rhead {
        background: #000; color: #fff; font-weight: 900; font-size: 19px;
        letter-spacing: .34em; padding: 9px 0 9px .34em;
      }
      #resDist { font-size: 58px; line-height: 1; padding: 16px 0 0; }
      #resDist small { font-size: 24px; }
      #resNewBest {
        display: none; margin: 8px auto 0; width: fit-content;
        background: #000; color: #fff; font-weight: 900; font-size: 13px;
        padding: 3px 12px; letter-spacing: .14em;
      }
      #resCoins {
        font-weight: 900; font-size: 19px; padding: 12px 0 4px;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      #resCoins .coin-ic { border-color: #000; color: #000; background: #fff; }
      #resAir { font-size: 13px; font-weight: 900; padding-top: 2px; letter-spacing: .08em; }
      #resSkill {
        display: none; margin: 8px auto 0; width: fit-content;
        background: #fff; color: #000; font-weight: 900; font-size: 12px;
        padding: 3px 10px; letter-spacing: .06em;
        border: 2px solid #000;
      }
      #resBest { font-size: 12px; font-weight: 700; padding-bottom: 14px; letter-spacing: .06em; }
      #okBtn {
        display: block; width: calc(100% - 24px); margin: 0 12px 14px;
        background: #000; color: #fff; font-weight: 900; font-size: 21px;
        letter-spacing: .3em; padding: 12px 0 12px .3em; min-height: 3.25rem;
        border: 3px solid #000;
      }
      #okBtn:active { background: #fff; color: #000; }

      #resetBtn {
        position: absolute; right: 10px; top: 64px; z-index: 25;
        font-size: 10px; font-weight: 700; letter-spacing: .12em;
        color: #fff; background: #000; border: 1px solid #fff;
        padding: 4px 8px; min-height: 2rem; display: none;
      }

      /* ---------- skills ---------- */
      #skillBtn {
        position: absolute; left: 10px; top: 64px; z-index: 25;
        background: #fff; color: #000; border: 2px solid #fff;
        font-weight: 900; font-size: 14px; letter-spacing: .18em;
        padding: 6px 16px 6px calc(16px + .18em); min-height: 2.25rem; display: none;
      }
      #skillBtn:active { background: #000; color: #fff; }
      #skills {
        position: absolute; inset: 0; z-index: 40;
        display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.6);
        padding: 20px;
      }
      #skillPanel {
        background: #fff; color: #000; width: 100%; max-width: 330px;
        border: 3px solid #fff; outline: 2px solid #000; outline-offset: -6px;
        max-height: 100%; overflow-y: auto;
      }
      #skillPanel .rhead {
        background: #000; color: #fff; font-weight: 900; font-size: 19px;
        letter-spacing: .34em; padding: 9px 0 9px .34em; text-align: center;
      }
      .skrow { padding: 10px 12px 12px; border-bottom: 2px solid #000; }
      .skrow .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .skrow .nm { font-weight: 900; font-size: 15px; }
      .skrow .slv {
        background: #000; color: #fff; flex: none;
        font-size: 11px; font-weight: 900; padding: 1px 5px;
        font-family: "Archivo", sans-serif; font-style: italic;
      }
      .skrow .ds { font-size: 11px; font-weight: 700; margin-top: 3px; letter-spacing: .03em; }
      .skrow .lock { font-size: 11px; font-weight: 900; margin-top: 6px; letter-spacing: .05em; }
      .skrow.locked .nm, .skrow.locked .ds { opacity: .45; }
      .skrow .buy {
        margin-top: 8px; width: 100%;
        background: #000; color: #fff;
        font-weight: 900; font-size: 15px;
        padding: 8px 4px; min-height: 2.5rem;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .skrow .buy .coin-ic { width: 16px; height: 16px; border-width: 2px; font-size: 9px; }
      .skrow .buy:disabled { background: #8a8a8a; color: #000; cursor: default; }
      .skrow .buy:not(:disabled):active { background: #fff; color: #000; }
      .skrow .max { margin-top: 8px; text-align: center; font-weight: 900; font-size: 13px; letter-spacing: .3em; }
      #skillClose {
        display: block; width: calc(100% - 24px); margin: 12px;
        background: #000; color: #fff; font-weight: 900; font-size: 17px;
        letter-spacing: .24em; padding: 10px 0 10px .24em; min-height: 3rem;
        border: 3px solid #000;
      }
      #skillClose:active { background: #fff; color: #000; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="cv"></canvas>

      <div id="topbar">
        <div id="coinbar">
          <span class="coin-ic">C</span>
          <span id="coinVal" class="num">0</span>
        </div>
        <button id="plusBtn" type="button">+100000</button>
        <div id="bestbar">
          <span class="lbl">BEST</span>
          <span id="bestVal" class="num">0m</span>
        </div>
      </div>

      <div id="hud">
        <div id="hudDist" class="num">0<small>m</small></div>
        <div id="hudStats">
          <div class="hstat"><span class="k">SPEED</span><span class="v num" id="hudSpeed">0<small> km/h</small></span></div>
          <div class="hstat"><span class="k">AIR TIME</span><span class="v num" id="hudAir">0.00<small> s</small></span></div>
        </div>
        <div><span id="ffTag">»» 2倍速</span></div>
      </div>

      <div id="tapHint">タップでスタート</div>

      <div id="cards">
        <div class="card" id="card-catapult">
          <div class="head"><span class="name">カタパルト</span><span class="lv">Lv.1</span></div>
          <div class="fx num">0</div>
          <div class="fxsub">初速 km/h</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
        <div class="card" id="card-ball">
          <div class="head"><span class="name">ボール</span><span class="lv">Lv.1</span></div>
          <div class="fx num">0</div>
          <div class="fxsub">跳ね・転がり</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
        <div class="card" id="card-income">
          <div class="head"><span class="name">収入</span><span class="lv">Lv.1</span></div>
          <div class="fx num">×0</div>
          <div class="fxsub">コイン倍率</div>
          <div class="pips"></div>
          <button class="buy" type="button"><span class="coin-ic">C</span><span class="cost num">0</span></button>
        </div>
      </div>

      <div id="aimUI">
        <div id="aimHint">下に引っ張って 離す！</div>
        <button id="backBtn" type="button">← もどる</button>
        <div id="gauge">
          <div class="row"><span class="k">ANGLE</span><span class="v num" id="gAngle">0°</span></div>
          <div class="row"><span class="k">POWER</span><span class="v num" id="gPower">0%</span></div>
          <div class="bar"><i id="gBar"></i></div>
        </div>
      </div>

      <button id="boostBtn" type="button" aria-label="ブースト">
        <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
          <circle id="boostRing" cx="38" cy="38" r="30.5" fill="none" stroke="#000" stroke-width="4" stroke-linecap="butt" transform="rotate(-90 38 38)" stroke-dasharray="191.6 191.6" />
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M12 2.5c3 2.6 4.5 6.2 4.5 10.2l-2.3 3.8h-4.4L7.5 12.7C7.5 8.7 9 5.1 12 2.5z" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="9.5" r="1.9" fill="#fff"/>
          <path d="M7.6 13.5 4.8 19l3.2-1.2M16.4 13.5 19.2 19l-3.2-1.2M10.4 20.2c.5 1 2.7 1 3.2 0l-.6-2.4h-2z" fill="currentColor" stroke="none"/>
        </svg>
        <span class="bt">BOOST</span>
      </button>

      <div id="result">
        <div id="resultPanel">
          <div class="rhead">RESULT</div>
          <div id="resDist" class="num">0<small>m</small></div>
          <div id="resNewBest">★ NEW RECORD ★</div>
          <div id="resCoins"><span class="coin-ic">C</span><span id="resCoinVal" class="num">+0</span></div>
          <div id="resAir">滞空時間 0.00秒</div>
          <div id="resSkill"></div>
          <div id="resBest">ベスト 0m</div>
          <button id="okBtn" type="button">OK</button>
        </div>
      </div>

      <button id="skillBtn" type="button">スキル</button>

      <div id="skills">
        <div id="skillPanel">
          <div class="rhead">SKILL</div>
          <div id="skillRows"></div>
          <button id="skillClose" type="button">とじる</button>
        </div>
      </div>

      <button id="resetBtn" type="button">データ初期化</button>
    </div>

    <script>
      'use strict';
      /* ================= save (localStorage) ================= */
      var SAVE_KEY = 'ball-throw-github-v1';
      var save = { coins: 0, lv: { catapult: 1, ball: 1, income: 1 }, best: 0, sk: { bounce: 0, income: 0, jet: 0 } };
      try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          var p = JSON.parse(raw);
          if (p && typeof p.coins === 'number') save.coins = p.coins;
          if (p && p.lv) {
            save.lv.catapult = p.lv.catapult | 0 || 1;
            save.lv.ball = p.lv.ball | 0 || 1;
            save.lv.income = p.lv.income | 0 || 1;
          }
          if (p && typeof p.best === 'number') save.best = p.best;
          if (p && p.sk) {
            save.sk.bounce = Math.max(0, p.sk.bounce | 0);
            save.sk.income = Math.max(0, p.sk.income | 0);
            save.sk.jet = Math.max(0, p.sk.jet | 0);
          }
        }
      } catch (e) { /* storage unavailable: play without saving */ }
      function persist() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      }

      /* ================= upgrades ================= */
      function cost(kind) {
        var base = { catapult: 50, ball: 50, income: 60 }[kind];
        // gentle curve: each level costs only ~18% more than the last
        return Math.round(base * Math.pow(1.18, save.lv[kind] - 1) / 5) * 5;
      }
      function launchSpeed() { return 13 + save.lv.catapult * 2.6; }        // m/s at full power
      // ball card upgrades ONLY bounce + rolling; airtime is pure physics
      // (launch speed x angle under real gravity), never a hidden stat
      function bounceK() { return Math.min(0.78, 0.40 + save.lv.ball * 0.032); }
      function rollFriction() { return Math.max(0.85, 4.4 - save.lv.ball * 0.30); }
      function incomeMult() { return 1 + (save.lv.income - 1) * 0.5; }

      /* ================= skills (unlocked by best distance) ================= */
      var SKILLS = [
        { id: 'bounce', name: 'バウンド回数増加', unlock: 30, max: 5, base: 300,
          fx: function (lv) { return 'バウンド上限 ' + (1 + lv) + '回'; } },
        { id: 'income', name: '収入ブースト', unlock: 80, max: 5, base: 500,
          fx: function (lv) { return '収入倍率に ×' + trimNum(1 + 0.5 * lv) + ' を追加'; } },
        { id: 'jet', name: 'ジェットパック強化', unlock: 150, max: 5, base: 800,
          fx: function (lv) { return 'ブースト推力 ×' + trimNum(1 + 0.2 * lv) + '・ゲージ ' + trimNum(1.8 * (1 + 0.25 * lv)) + '秒'; } }
      ];
      function skillCost(s) { return Math.round(s.base * Math.pow(1.35, save.sk[s.id]) / 5) * 5; }
      function maxBounces() { return 1 + save.sk.bounce; }              // base 1 bounce + skill
      function skillIncomeMult() { return 1 + 0.5 * save.sk.income; }   // multiplies the card multiplier
      function totalIncomeMult() { return incomeMult() * skillIncomeMult(); }
      function jetK() { return 1 + 0.2 * save.sk.jet; }                 // boost thrust multiplier
      function gaugeSeconds() { return 1.8 * (1 + 0.25 * save.sk.jet); } // boost gauge capacity, in seconds of burn
      // skins change every 5 levels: tier 0 = Lv1-4, 1 = Lv5-9, 2 = Lv10-14...
      function skinTier(lv) { return Math.min(4, Math.floor((lv - 1) / 5)); }

      function fmt(n) {
        n = Math.floor(n);
        if (n >= 1e6) return trimNum(n / 1e6) + 'M';
        if (n >= 10000) return trimNum(n / 1000) + 'k';
        return String(n);
      }
      function trimNum(v) {
        var s = v.toFixed(2);
        return s.replace(/\.?0+$/, '');
      }

      /* ================= DOM ================= */
      var stage = document.getElementById('stage');
      var cv = document.getElementById('cv');
      var ctx = cv.getContext('2d');
      var coinVal = document.getElementById('coinVal');
      var bestVal = document.getElementById('bestVal');
      var hud = document.getElementById('hud');
      var hudDist = document.getElementById('hudDist');
      var hudSpeed = document.getElementById('hudSpeed');
      var hudAir = document.getElementById('hudAir');
      var ffTag = document.getElementById('ffTag');
      var tapHint = document.getElementById('tapHint');
      var cardsEl = document.getElementById('cards');
      var aimUI = document.getElementById('aimUI');
      var gauge = document.getElementById('gauge');
      var gAngle = document.getElementById('gAngle');
      var gPower = document.getElementById('gPower');
      var gBar = document.getElementById('gBar');
      var boostBtn = document.getElementById('boostBtn');
      var boostRing = document.getElementById('boostRing');
      var resultEl = document.getElementById('result');
      var resetBtn = document.getElementById('resetBtn');
      var skillBtn = document.getElementById('skillBtn');
      var skillsEl = document.getElementById('skills');
      var skillRows = document.getElementById('skillRows');

      var W = 0, H = 0;
      function resize() {
        var r = stage.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = r.width; H = r.height;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dirty = true;
      }
      window.addEventListener('resize', resize);
      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

      /* ================= game state ================= */
      var GRAV = 9.8; // real gravity: falls accelerate naturally, no float factor
      var state = 'select'; // select | aim | fly | result
      var ball = { z: 0, y: 0, vz: 0, vy: 0, rolling: false, spin: 0, bounces: 0 };
      var camZ = 0, camY = 0;
      var pull = null;      // {startY, r} while dragging in aim
      var boostGauge = 1;   // 0..1, refilled at every launch; hold BOOST to burn it
      var boosting = false; // true while the BOOST button is held with gauge left
      var airTime = 0;      // seconds spent airborne this flight (physics time)
      var ff = false;       // long-press fast-forward (x2) during flight
      var lastTs = 0;
      var dirty = true; // repaint only when something actually changed (flight = every frame)

      function pullAngle(r) { return (65 - 20 * r) * Math.PI / 180; }
      function pullSpeed(r) { return launchSpeed() * (0.30 + 0.70 * r); }

      /* boost gauge = the black ring inside the BOOST button. Full: the ring
         closes the circle. As it burns, the ring's tail end stays at the top
         and its start is eaten away clockwise, so the remaining arc shrinks
         clockwise until the ring disappears entirely. */
      var RING_C = 2 * Math.PI * 30.5; // circumference of the gauge ring
      function renderBoostRing() {
        var g = Math.max(0, Math.min(1, boostGauge));
        boostRing.setAttribute('stroke-dasharray', (g * RING_C).toFixed(2) + ' ' + RING_C.toFixed(2));
        boostRing.setAttribute('transform', 'rotate(' + (-90 + (1 - g) * 360).toFixed(2) + ' 38 38)');
      }

      function toAim() {
        state = 'aim';
        dirty = true;
        cardsEl.style.display = 'none';
        tapHint.style.display = 'none';
        resetBtn.style.display = 'none';
        skillBtn.style.display = 'none';
        skillsEl.style.display = 'none';
        aimUI.style.display = 'block';
        pull = null;
        gauge.style.display = 'none';
      }
      function toSelect() {
        state = 'select';
        dirty = true;
        ball.z = 0; ball.y = 0; ball.vz = 0; ball.vy = 0; ball.rolling = false; ball.bounces = 0;
        camZ = 0; camY = 0; pull = null; boostGauge = 1; boosting = false; airTime = 0;
        ff = false; ffTag.style.display = 'none';
        cardsEl.style.display = 'flex';
        tapHint.style.display = 'block';
        resetBtn.style.display = 'block';
        skillBtn.style.display = 'block';
        aimUI.style.display = 'none';
        hud.style.display = 'none';
        boostBtn.style.display = 'none';
        resultEl.style.display = 'none';
        refreshUI();
      }
      function launch(r) {
        var a = pullAngle(r), v = pullSpeed(r);
        ball.vz = v * Math.cos(a);
        ball.vy = v * Math.sin(a);
        ball.z = 0; ball.y = 0; ball.rolling = false; ball.bounces = 0;
        boostGauge = 1; boosting = false; airTime = 0;   // gauge starts full every flight
        renderBoostRing();
        ff = false; ffTag.style.display = 'none';
        state = 'fly';
        aimUI.style.display = 'none';
        hud.style.display = 'block';
        boostBtn.style.display = 'flex';
        boostBtn.classList.remove('used');
        boostBtn.classList.remove('on');
      }
      function finishFlight() {
        var dist = ball.z;
        // coins are settled only here, at the result (nothing accrues on the HUD)
        var earned = Math.floor(dist * totalIncomeMult());
        save.coins += earned;
        var oldBest = save.best;
        var isBest = dist > save.best;
        if (isBest) save.best = dist;
        var unlockedNow = [];
        SKILLS.forEach(function (s) {
          if (oldBest < s.unlock && save.best >= s.unlock) unlockedNow.push(s.name);
        });
        persist();
        state = 'result';
        ff = false; ffTag.style.display = 'none';
        boosting = false;
        hud.style.display = 'none';
        boostBtn.style.display = 'none';
        document.getElementById('resDist').innerHTML = fmt(dist) + '<small>m</small>';
        document.getElementById('resCoinVal').textContent = '+' + fmt(earned);
        document.getElementById('resAir').textContent = '滞空時間 ' + airTime.toFixed(2) + '秒';
        var resSkill = document.getElementById('resSkill');
        if (unlockedNow.length) {
          resSkill.textContent = 'スキル開放：' + unlockedNow.join(' / ');
          resSkill.style.display = 'block';
        } else {
          resSkill.style.display = 'none';
        }
        document.getElementById('resBest').textContent = 'ベスト ' + fmt(save.best) + 'm';
        document.getElementById('resNewBest').style.display = isBest ? 'block' : 'none';
        resultEl.style.display = 'flex';
        refreshUI();
      }

      /* ================= physics ================= */
      function stepPhysics(dt) {
        if (state !== 'fly') return;
        // hold-to-boost: while BOOST is held and gauge remains, thrust is
        // applied continuously and the gauge drains; empty = done for this flight
        if (boosting) {
          if (boostGauge > 0) {
            boostGauge = Math.max(0, boostGauge - dt / gaugeSeconds());
            var jk = jetK();
            if (ball.rolling) {
              // jet liftoff from a roll; the next landing rolls again
              ball.rolling = false;
              ball.vy = 6.5 * jk;
              ball.bounces = maxBounces();
            } else {
              ball.vz += 16 * jk * dt;
              ball.vy += 10.5 * jk * dt;
            }
            if (boostGauge <= 0) {
              boosting = false;
              boostBtn.classList.remove('on');
              boostBtn.classList.add('used');
            }
          } else {
            boosting = false;
            boostBtn.classList.remove('on');
          }
        }
        renderBoostRing();
        var steps = Math.max(1, Math.ceil(dt / 0.0083));
        var h = dt / steps;
        for (var i = 0; i < steps; i++) {
          if (ball.rolling) {
            ball.vz -= rollFriction() * h;
            if (ball.vz <= 0) { ball.vz = 0; break; }
            ball.z += ball.vz * h;
          } else {
            ball.vy -= GRAV * h;
            ball.z += ball.vz * h;
            ball.y += ball.vy * h;
            if (ball.y <= 0) {
              ball.y = 0;
              // bounce only up to the cap (base 1 + bounce skill);
              // the next ground contact after that rolls instead
              if (ball.bounces < maxBounces() && Math.abs(ball.vy) >= 2.3) {
                ball.bounces++;
                ball.vy = -ball.vy * bounceK();
                ball.vz *= 0.90;
              } else {
                ball.rolling = true; ball.vy = 0;
              }
            }
          }
        }
        if (!ball.rolling) airTime += dt;
        ball.spin += ball.vz * dt * 1.6;
        // camera chases the ball
        var targetZ = Math.max(0, ball.z - 7);
        camZ += (targetZ - camZ) * Math.min(1, dt * 10);
        if (state === 'fly' && ball.z - camZ < 6) camZ = Math.max(0, ball.z - 7);
        var targetY = Math.max(0, ball.y - 3.5) * 0.72;
        camY += (targetY - camY) * Math.min(1, dt * 5);
        hudDist.innerHTML = fmt(ball.z) + '<small>m</small>';
        var spd = Math.sqrt(ball.vz * ball.vz + ball.vy * ball.vy) * 3.6;
        hudSpeed.innerHTML = Math.round(spd) + '<small> km/h</small>';
        hudAir.innerHTML = airTime.toFixed(2) + '<small> s</small>';
        if (ball.rolling && ball.vz <= 0.01) finishFlight();
      }

      /* ================= rendering ================= */
      var HORIZON = 0.34;   // fraction of H
      var FOCAL = 8;        // m
      var CAMH = 1.2;       // m
      function unit() { return H * 0.55; }
      function yUnit() { return H * 0.13; }
      function persp(relZ) { return FOCAL / (FOCAL + Math.max(0, relZ)); }
      function groundY(relZ) {
        var p = persp(relZ);
        // camY (camera tilting up after a high ball) shifts the world down
        // at the same vertical scale the ball rises with, so the ball's net
        // height above its ground anchor is (ball.y - camY).
        return H * HORIZON + CAMH * p * unit() + camY * p * yUnit();
      }
      function roadHalfW(relZ) { return 3.1 * persp(relZ) * unit(); } // road half width 3.1m
      function screenX(relZ, wx) { return W / 2 + wx * persp(relZ) * unit(); }

      // deterministic tree placement
      function treeAt(i) {
        var h1 = Math.sin(i * 127.1) * 43758.5453;
        var frac = h1 - Math.floor(h1);
        var side = i % 2 === 0 ? -1 : 1;
        return { z: i * 13 + frac * 6, x: side * (5.6 + frac * 3.4), w: 0.34 + frac * 0.22 };
      }

      function drawScene() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        var horizonY = H * HORIZON;
        var farZ = 150;

        /* ----- road (gray, dark far -> light near) ----- */
        var x0L = screenX(0, -3.1), x0R = screenX(0, 3.1), y0 = groundY(0);
        var xFL = screenX(farZ, -3.1), xFR = screenX(farZ, 3.1), yF = groundY(farZ);
        var grad = ctx.createLinearGradient(0, yF, 0, y0);
        grad.addColorStop(0, '#242424');
        grad.addColorStop(0.55, '#555');
        grad.addColorStop(1, '#9a9a9a');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x0L, y0); ctx.lineTo(x0R, y0); ctx.lineTo(xFR, yF); ctx.lineTo(xFL, yF);
        ctx.closePath(); ctx.fill();

        /* ----- distance markings on the road ----- */
        var startM = Math.floor(camZ / 10) * 10;
        ctx.textAlign = 'left';
        for (var m = startM; m < camZ + farZ; m += 10) {
          if (m <= 0) continue;
          var rel = m - camZ;
          if (rel < 0.4) continue;
          var p = persp(rel);
          var gy = groundY(rel);
          var hw = roadHalfW(rel);
          var big = m % 50 === 0;
          if (!big && rel > 90) continue;
          ctx.strokeStyle = big ? '#fff' : 'rgba(255,255,255,' + Math.min(0.75, 0.25 + p) + ')';
          ctx.lineWidth = big ? Math.max(2, 5 * p) : Math.max(1, 2.2 * p);
          ctx.beginPath();
          ctx.moveTo(W / 2 - hw, gy); ctx.lineTo(W / 2 + hw, gy);
          ctx.stroke();
          if (big) {
            // label centered on the near side of the line: always fully
            // on the road surface, readable at any distance
            var fs = Math.max(10, 30 * p);
            ctx.fillStyle = '#fff';
            ctx.font = 'italic 900 ' + fs + 'px Archivo, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(m + 'm', W / 2, gy + fs * 1.15);
            ctx.textAlign = 'left';
          }
        }

        // start checker band
        if (camZ < 4) {
          var rel0 = 0 - camZ;
          var gy0 = groundY(Math.max(0, rel0));
          var hw0 = roadHalfW(Math.max(0, rel0));
          var sq = hw0 / 4;
          for (var s = 0; s < 8; s++) {
            ctx.fillStyle = s % 2 === 0 ? '#fff' : '#000';
            ctx.fillRect(W / 2 - hw0 + s * sq, gy0 - sq * 0.5, sq, sq * 0.5);
          }
        }

        /* ----- road edge pinstripes (white) ----- */
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(2, W * 0.008);
        ctx.beginPath(); ctx.moveTo(x0L, y0); ctx.lineTo(xFL, yF); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0R, y0); ctx.lineTo(xFR, yF); ctx.stroke();
        // center dashes
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = Math.max(1, 3 * persp(6));
        var dashStart = Math.floor(camZ / 6) * 6;
        for (var d = dashStart; d < camZ + 60; d += 6) {
          var r1 = d - camZ, r2 = d + 2.6 - camZ;
          if (r2 < 0.5) continue;
          ctx.beginPath();
          ctx.moveTo(W / 2, groundY(Math.max(0.5, r1)));
          ctx.lineTo(W / 2, groundY(Math.max(0.6, r2)));
          ctx.stroke();
        }

        /* ----- trees: leafless gray trunks to the top ----- */
        var i0 = Math.max(0, Math.floor((camZ - 4) / 13) - 1);
        var i1 = Math.floor((camZ + farZ) / 13) + 1;
        var trees = [];
        for (var i = i0; i <= i1; i++) {
          var t = treeAt(i);
          var relT = t.z - camZ;
          if (relT < -3 || relT > farZ) continue;
          trees.push({ t: t, rel: relT });
        }
        trees.sort(function (a, b) { return b.rel - a.rel; }); // far first
        for (var k = 0; k < trees.length; k++) {
          var tr = trees[k].t, relK = trees[k].rel;
          var pk = persp(Math.max(0, relK));
          var tx = screenX(Math.max(0, relK), tr.x);
          var tBase = groundY(Math.max(0, relK));
          var tw = Math.max(2, tr.w * pk * unit());
          // trunk: straight to above the top of the screen
          ctx.fillStyle = '#6f6f6f';
          ctx.fillRect(tx - tw / 2, -60, tw, tBase + 60);
          // white rim light on the inner edge
          ctx.fillStyle = '#e8e8e8';
          var rimX = tr.x < 0 ? tx + tw / 2 - Math.max(1, tw * 0.22) : tx - tw / 2;
          ctx.fillRect(rimX, -60, Math.max(1, tw * 0.22), tBase + 60);
          // dark bands
          ctx.fillStyle = '#3d3d3d';
          var bandStep = 1.7; // m
          for (var hb = bandStep; hb < 60; hb += bandStep) {
            var by = tBase - hb * pk * yUnit();
            if (by < -70) break;
            var bh = Math.max(1.5, 0.16 * pk * yUnit());
            ctx.fillRect(tx - tw / 2, by, tw, bh);
          }
        }

        /* ----- catapult (visible near start; skin changes every 5 levels) ----- */
        var drawCatapult = camZ < 8;
        if (drawCatapult && ball.z < 9) {
          var relC = Math.max(0, 7 - camZ);
          var pc = persp(relC);
          var cxp = W / 2, cBase = groundY(relC);
          var ct = skinTier(save.lv.catapult);
          var postH = 0.95 * pc * yUnit() * 1.9;
          var postW = Math.max(3, 0.13 * pc * unit()) * (ct >= 1 ? 1.35 : 1);
          var spread = 0.52 * pc * unit();
          var postFill = ['#000', '#3d3d3d', '#767676', '#fff', '#000'][ct];
          var postLine = ct === 3 ? '#000' : '#fff';
          ctx.fillStyle = postFill;
          // base slab
          ctx.fillRect(cxp - spread - postW, cBase - postW * 0.8, (spread + postW) * 2, postW * 0.8);
          ctx.strokeStyle = postLine; ctx.lineWidth = 2;
          ctx.strokeRect(cxp - spread - postW, cBase - postW * 0.8, (spread + postW) * 2, postW * 0.8);
          // posts
          ctx.fillRect(cxp - spread - postW / 2, cBase - postH, postW, postH);
          ctx.fillRect(cxp + spread - postW / 2, cBase - postH, postW, postH);
          if (ct >= 2) {
            // cross braces between the posts
            ctx.strokeStyle = postLine; ctx.lineWidth = Math.max(2, postW * 0.4);
            ctx.beginPath();
            ctx.moveTo(cxp - spread, cBase - postH * 0.15);
            ctx.lineTo(cxp + spread, cBase - postH * 0.85);
            ctx.moveTo(cxp + spread, cBase - postH * 0.15);
            ctx.lineTo(cxp - spread, cBase - postH * 0.85);
            ctx.stroke();
          }
          if (ct >= 4) {
            // wheels on the base
            ctx.fillStyle = postFill;
            ctx.strokeStyle = postLine; ctx.lineWidth = 2;
            var wr = postW * 0.95;
            ctx.beginPath(); ctx.arc(cxp - spread - postW * 0.4, cBase + wr * 0.3, wr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(cxp + spread + postW * 0.4, cBase + wr * 0.3, wr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          }
          // band to the ball rest point
          var restY = cBase - postH - 0.30 * pc * unit() * 0.34;
          ctx.strokeStyle = postLine; ctx.lineWidth = Math.max(2, postW * (ct >= 4 ? 0.8 : 0.5));
          ctx.beginPath();
          ctx.moveTo(cxp - spread, cBase - postH);
          ctx.lineTo(cxp, restY + 4);
          ctx.lineTo(cxp + spread, cBase - postH);
          ctx.stroke();
        }

        /* ----- dotted trajectory guide (aim) ----- */
        if (state === 'aim' && pull && pull.r > 0.03) {
          var a = pullAngle(pull.r), v = pullSpeed(pull.r);
          var vz = v * Math.cos(a), vy = v * Math.sin(a);
          var gz = 0, gy2 = 0.55, dt = 0.055;
          ctx.fillStyle = '#fff';
          for (var s2 = 0; s2 < 46; s2++) {
            vy -= GRAV * dt;
            gz += vz * dt; gy2 += vy * dt;
            if (gy2 < 0) break;
            var relG = gz + 7 - camZ;
            var pg = persp(relG);
            var sx = W / 2;
            var sy = groundY(relG) - gy2 * pg * yUnit();
            // guide starts at the ball rest height
            var rDot = Math.max(1.6, 0.075 * pg * unit());
            ctx.beginPath(); ctx.arc(sx, sy, rDot, 0, Math.PI * 2); ctx.fill();
          }
        }

        /* ----- ball shadow ----- */
        var ballRelZ = Math.max(0.5, (ball.z - camZ) + 7);
        var pb = persp(ballRelZ);
        var bx = W / 2;
        var bGroundY = groundY(ballRelZ);
        var ballR = Math.max(4, 0.27 * pb * unit());
        // rest offset: when z=0 the ball sits on the catapult (raised)
        var restLift = (state === 'select' || state === 'aim') ? ballR * 0.55 : 0;
        var by = bGroundY - ball.y * pb * yUnit() - ballR - restLift;
        var shadowScale = Math.max(0.25, 1 - ball.y * 0.03);
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.beginPath();
        ctx.ellipse(bx, bGroundY + ballR * 0.25, ballR * 1.05 * shadowScale, ballR * 0.30 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        /* ----- ball (skin changes every 5 levels) ----- */
        var squash = pull && state === 'aim' ? 1 - pull.r * 0.18 : 1;
        var btier = skinTier(save.lv.ball);
        var bFill = ['#ffffff', '#d9d9d9', '#8c8c8c', '#262626', '#ffffff'][btier];
        var bLine = btier === 3 ? '#ffffff' : '#000000';
        ctx.save();
        ctx.translate(bx, by);
        ctx.scale(1 / squash, squash);
        if (btier >= 4) {
          // outer ring on the top skin
          ctx.beginPath(); ctx.arc(0, 0, ballR * 1.22, 0, Math.PI * 2);
          ctx.lineWidth = Math.max(1.5, ballR * 0.1); ctx.strokeStyle = bLine; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, ballR, 0, Math.PI * 2);
        ctx.fillStyle = bFill; ctx.fill();
        ctx.lineWidth = Math.max(2, ballR * 0.14); ctx.strokeStyle = bLine; ctx.stroke();
        // rotating seam
        ctx.save();
        ctx.rotate(ball.spin % (Math.PI * 2));
        ctx.beginPath(); ctx.arc(0, 0, ballR * 0.62, 0.3, Math.PI - 0.3);
        ctx.lineWidth = Math.max(1.5, ballR * 0.13); ctx.strokeStyle = bLine; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, ballR * 0.62, Math.PI + 0.3, Math.PI * 2 - 0.3);
        ctx.stroke();
        if (btier >= 2) {
          // vertical seam across the middle
          ctx.beginPath();
          ctx.moveTo(0, -ballR * 0.86); ctx.lineTo(0, ballR * 0.86);
          ctx.stroke();
        }
        ctx.restore();
        if (btier >= 1) {
          // inner ring
          ctx.beginPath(); ctx.arc(0, 0, ballR * 0.82, 0, Math.PI * 2);
          ctx.lineWidth = Math.max(1, ballR * 0.07); ctx.strokeStyle = bLine; ctx.stroke();
        }
        if (btier >= 3) {
          // three studs
          ctx.fillStyle = bLine;
          ctx.beginPath(); ctx.arc(0, -ballR * 0.3, ballR * 0.11, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(-ballR * 0.32, ballR * 0.26, ballR * 0.11, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ballR * 0.32, ballR * 0.26, ballR * 0.11, 0, Math.PI * 2); ctx.fill();
        }
        // highlight dot
        ctx.beginPath(); ctx.arc(-ballR * 0.34, -ballR * 0.38, ballR * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = bLine; ctx.fill();
        ctx.restore();

        // horizon hairline (keeps far road readable against black)
        ctx.fillStyle = 'rgba(255,255,255,.28)';
        ctx.fillRect(0, groundY(farZ), W, 1);
      }

      /* ================= loop ================= */
      function frame(ts) {
        if (!lastTs) lastTs = ts;
        var dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        // long-press during flight runs the simulation at 2x
        stepPhysics(dt * (ff && state === 'fly' ? 2 : 1));
        // in select/aim the camera relaxes home
        if (state === 'select' || state === 'aim') { camZ = 0; camY = 0; }
        if (state === 'fly' || dirty) { drawScene(); dirty = false; }
        requestAnimationFrame(frame);
      }

      /* ================= UI refresh ================= */
      var cardDefs = [
        { kind: 'catapult', fx: function () { return Math.round(launchSpeed() * 3.6); } },
        { kind: 'ball', fx: function () { return (bounceK() * 100).toFixed(0) + '%'; } },
        { kind: 'income', fx: function () { return '×' + trimNum(incomeMult()); } }
      ];
      function refreshUI() {
        coinVal.textContent = fmt(save.coins);
        bestVal.textContent = fmt(save.best) + 'm';
        cardDefs.forEach(function (d) {
          var card = document.getElementById('card-' + d.kind);
          card.querySelector('.lv').textContent = 'Lv.' + save.lv[d.kind];
          card.querySelector('.fx').textContent = d.fx();
          if (d.kind === 'ball') {
            card.querySelector('.fxsub').textContent = '跳ね・転がり';
          }
          if (d.kind === 'income') {
            card.querySelector('.fxsub').textContent = save.sk.income > 0
              ? 'コイン倍率（スキル込み ×' + trimNum(totalIncomeMult()) + '）'
              : 'コイン倍率';
          }
          var c = cost(d.kind);
          card.querySelector('.cost').textContent = fmt(c);
          card.querySelector('.buy').disabled = save.coins < c;
          var pips = card.querySelector('.pips');
          if (!pips.children.length) {
            for (var i = 0; i < 5; i++) pips.appendChild(document.createElement('i'));
          }
          var on = ((save.lv[d.kind] - 1) % 5) + 1;
          for (var j = 0; j < 5; j++) pips.children[j].className = j < on ? 'on' : '';
        });
      }

      /* ================= skills UI ================= */
      function refreshSkills() {
        skillRows.innerHTML = '';
        SKILLS.forEach(function (s) {
          var lv = save.sk[s.id];
          var unlocked = save.best >= s.unlock;
          var row = document.createElement('div');
          row.className = 'skrow' + (unlocked ? '' : ' locked');
          var top = document.createElement('div');
          top.className = 'top';
          var nm = document.createElement('span');
          nm.className = 'nm'; nm.textContent = s.name;
          var slv = document.createElement('span');
          slv.className = 'slv'; slv.textContent = lv > 0 ? 'Lv.' + lv : 'Lv.0';
          top.appendChild(nm); top.appendChild(slv);
          row.appendChild(top);
          var ds = document.createElement('div');
          ds.className = 'ds';
          ds.textContent = lv > 0 ? s.fx(lv) : 'まだ効果なし';
          if (unlocked && lv < s.max) ds.textContent += ' → 次：' + s.fx(lv + 1);
          row.appendChild(ds);
          if (!unlocked) {
            var lock = document.createElement('div');
            lock.className = 'lock';
            lock.textContent = '未開放：ベスト ' + fmt(s.unlock) + 'm で開放（現在 ' + fmt(save.best) + 'm）';
            row.appendChild(lock);
          } else if (lv >= s.max) {
            var mx = document.createElement('div');
            mx.className = 'max'; mx.textContent = 'MAX';
            row.appendChild(mx);
          } else {
            var c = skillCost(s);
            var buy = document.createElement('button');
            buy.type = 'button';
            buy.className = 'buy';
            buy.innerHTML = '<span class="coin-ic">C</span><span class="num">' + fmt(c) + '</span>';
            buy.disabled = save.coins < c;
            buy.addEventListener('click', function (ev) {
              ev.stopPropagation();
              var cc = skillCost(s);
              if (save.coins < cc || save.sk[s.id] >= s.max) return;
              save.coins -= cc;
              save.sk[s.id] += 1;
              persist();
              refreshUI();
              refreshSkills();
            });
            row.appendChild(buy);
          }
          skillRows.appendChild(row);
        });
      }
      skillBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (state !== 'select') return;
        refreshSkills();
        skillsEl.style.display = 'flex';
      });
      document.getElementById('skillClose').addEventListener('click', function (ev) {
        ev.stopPropagation();
        skillsEl.style.display = 'none';
      });
      skillsEl.addEventListener('click', function (ev) {
        if (ev.target === skillsEl) skillsEl.style.display = 'none';
      });

      /* ================= input ================= */
      cardDefs.forEach(function (d) {
        var btn = document.querySelector('#card-' + d.kind + ' .buy');
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var c = cost(d.kind);
          if (save.coins < c) return;
          save.coins -= c;
          save.lv[d.kind] += 1;
          persist();
          refreshUI();
        });
      });

      document.getElementById('plusBtn').addEventListener('click', function (ev) {
        ev.stopPropagation();
        save.coins += 100000;
        persist();
        refreshUI();
      });
      document.getElementById('backBtn').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (state === 'aim') toSelect();
      });
      document.getElementById('okBtn').addEventListener('click', function () { toSelect(); });
      // BOOST is hold-to-burn: press and hold to keep thrusting while the
      // gauge lasts; release stops both thrust and drain. Holding anywhere
      // else on the stage is the 2x fast-forward, never the boost.
      boostBtn.addEventListener('pointerdown', function (ev) {
        ev.stopPropagation();
        if (state !== 'fly' || boostGauge <= 0) return;
        boosting = true;
        boostBtn.classList.add('on');
        try { boostBtn.setPointerCapture(ev.pointerId); } catch (e) {}
        ev.preventDefault();
      });
      function endBoost() {
        if (!boosting) return;
        boosting = false;
        boostBtn.classList.remove('on');
      }
      boostBtn.addEventListener('pointerup', endBoost);
      boostBtn.addEventListener('pointercancel', endBoost);
      boostBtn.addEventListener('lostpointercapture', endBoost);
      boostBtn.addEventListener('click', function (ev) { ev.stopPropagation(); });
      var resetArmed = false;
      resetBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!resetArmed) {
          resetArmed = true;
          resetBtn.textContent = '本当に初期化？';
          setTimeout(function () { resetArmed = false; resetBtn.textContent = 'データ初期化'; }, 2600);
          return;
        }
        save = { coins: 0, lv: { catapult: 1, ball: 1, income: 1 }, best: 0, sk: { bounce: 0, income: 0, jet: 0 } };
        persist();
        resetArmed = false;
        resetBtn.textContent = 'データ初期化';
        refreshUI();
        refreshSkills();
      });

      // tap (select -> aim) + pull (aim)
      var tapTrack = null;
      stage.addEventListener('pointerdown', function (e) {
        if (skillsEl.style.display === 'flex') return; // skill panel open: no tap-through
        if (state === 'fly') {
          // hold anywhere except the BOOST button = 2x fast-forward
          if (e.target.closest('button')) return;
          ff = true;
          ffTag.style.display = 'inline-block';
          return;
        }
        if (e.target.closest('button') || e.target.closest('.card') || e.target.closest('#topbar')) return;
        if (state === 'select') {
          tapTrack = { x: e.clientX, y: e.clientY, t: performance.now() };
        } else if (state === 'aim') {
          pull = { startY: e.clientY, r: 0 };
          dirty = true;
          stage.setPointerCapture(e.pointerId);
        }
      });
      stage.addEventListener('pointermove', function (e) {
        if (state === 'aim' && pull) {
          var rect = stage.getBoundingClientRect();
          var maxPull = rect.height * 0.34;
          var dy = e.clientY - pull.startY;
          pull.r = Math.max(0, Math.min(1, dy / maxPull));
          dirty = true;
          if (pull.r > 0.02) {
            gauge.style.display = 'block';
            gAngle.textContent = Math.round(65 - 20 * pull.r) + '°';
            gPower.textContent = Math.round(pull.r * 100) + '%';
            gBar.style.width = (pull.r * 100) + '%';
          } else {
            gauge.style.display = 'none';
          }
        }
      });
      function endPointer(e) {
        if (ff) { ff = false; ffTag.style.display = 'none'; }
        if (state === 'select' && tapTrack) {
          var moved = Math.hypot(e.clientX - tapTrack.x, e.clientY - tapTrack.y);
          if (moved < 14 && performance.now() - tapTrack.t < 600) toAim();
          tapTrack = null;
        } else if (state === 'aim' && pull) {
          var r = pull.r;
          pull = null;
          gauge.style.display = 'none';
          dirty = true;
          if (r > 0.10) launch(r);
        }
      }
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', function () {
        tapTrack = null;
        ff = false; ffTag.style.display = 'none';
        if (state === 'aim') { pull = null; gauge.style.display = 'none'; dirty = true; }
      });
      // block context menu / scroll gestures on the stage
      stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      /* ================= boot ================= */
      resize();
      requestAnimationFrame(function () { resize(); });
      toSelect();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
