<style>

/* ============================================================
   音（WebAudio・簡易合成）
   ============================================================ */
let audio = null;
function ensureAudio(){
  if(!audio){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audio = new AC();
  }
  if(audio && audio.state === 'suspended') audio.resume();
}
function tone(freq, dur, type, gainVal, sweepTo){
  if(!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const g = audio.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if(sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gainVal, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audio.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noiseBurst(dur, gainVal, filterFreq){
  if(!audio) return;
  const t = audio.currentTime;
  const len = Math.max(1, Math.floor(audio.sampleRate * dur));
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audio.createBufferSource(); src.buffer = buf;
  const flt = audio.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = filterFreq || 1400;
  const g = audio.createGain(); g.gain.value = gainVal;
  src.connect(flt); flt.connect(g); g.connect(audio.destination);
  src.start(t);
}
const SFX = {
  knock(){ noiseBurst(0.32, 0.32, 900); tone(150, 0.22, 'triangle', 0.2, 70); },
  step(){ noiseBurst(0.05, 0.05, 600); },
  spotted(){ tone(880, 0.5, 'sawtooth', 0.2, 180); },
  clear(){ tone(523, 0.16, 'sine', 0.18); setTimeout(()=>tone(784,0.4,'sine',0.18),140); },
  alert(){ tone(420, 0.18, 'square', 0.07, 520); },
};

/* ============================================================
   幾何ヘルパー
   ============================================================ */
function circleRect(cx,cy,r,rect){
  const nx = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}
function rayAABB(ox,oy,dx,dy,rect){
  let tmin = 0, tmax = Infinity;
  const invDx = dx !== 0 ? 1/dx : 1e9;
  const invDy = dy !== 0 ? 1/dy : 1e9;
  let t1 = (rect.x-ox)*invDx, t2 = (rect.x+rect.w-ox)*invDx;
  if(t1>t2){const s=t1;t1=t2;t2=s;}
  tmin = Math.max(tmin,t1); tmax = Math.min(tmax,t2);
  let t3 = (rect.y-oy)*invDy, t4 = (rect.y+rect.h-oy)*invDy;
  if(t3>t4){const s=t3;t3=t4;t4=s;}
  tmin = Math.max(tmin,t3); tmax = Math.min(tmax,t4);
  if(tmax >= tmin && tmax >= 0) return tmin > 0 ? tmin : 0;
  return Infinity;
}
function rayCircle(ox,oy,dx,dy,cx,cy,r){
  const ex = ox-cx, ey = oy-cy;
  const b = ex*dx + ey*dy;
  const c = ex*ex + ey*ey - r*r;
  if(c > 0 && b > 0) return Infinity;
  const disc = b*b - c;
  if(disc < 0) return Infinity;
  const t = -b - Math.sqrt(disc);
  return t >= 0 ? t : 0;
}
function angDiff(a,b){
  let d = a-b;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}
function lerpAngle(cur, target, maxStep){
  const d = angDiff(target, cur);
  if(Math.abs(d) <= maxStep) return target;
  return cur + Math.sign(d)*maxStep;
}

/* ============================================================
   ゲーム状態
   ============================================================ */
let stageIndex = 0;
let stage = null;
let walls = [], props = [], guards = [], noises = [];
const player = {x:0, y:0, inputMag:0, stepTimer:0};
let state = 'playing';      // playing | caught | clear | allclear
let elapsed = 0, failCount = 0;
let spottedFx = 0;

function occluders(){
  // 倒れた物は背が低いので視線を遮らない
  return props.filter(p => !p.fallen);
}

function sightBlocked(ox,oy,dirx,diry,dist){
  for(const w of walls){
    if(rayAABB(ox,oy,dirx,diry,w) < dist) return true;
  }
  for(const p of occluders()){
    if(rayCircle(ox,oy,dirx,diry,p.x,p.y,p.r) < dist) return true;
  }
  return false;
}
function rayDist(ox,oy,dirx,diry,maxD){
  let best = maxD;
  for(const w of walls){
    const t = rayAABB(ox,oy,dirx,diry,w);
    if(t < best) best = t;
  }
  for(const p of occluders()){
    const t = rayCircle(ox,oy,dirx,diry,p.x,p.y,p.r);
    if(t < best) best = t;
  }
  return best;
}

function loadStage(i){
  stageIndex = i;
  stage = STAGES[i];
  walls = stage.walls.map(w => ({...w}));
  props = stage.props.map(p => ({...p, fallen:false, fallT:0, ox:p.x, oy:p.y}));
  noises = [];
  guards = stage.guards.map(g => {
    const p0 = g.path[0];
    const face = g.face !== undefined ? g.face
      : (g.path.length > 1 ? Math.atan2(g.path[1].y-p0.y, g.path[1].x-p0.x) : 0);
    return {
      x:p0.x, y:p0.y,
      path:g.path.map(p=>({...p})), leg:0, t:0, speed:g.speed,
      sweep:g.sweep, sweepT:g.sweepT, sweepPhase: Math.random()*Math.PI*2,
      homeFace: face,
      bodyAngle: face, neck: 0,
      mode:'patrol',            // patrol | investigate | search
      target:null, searchTimer:0, alertGlow:0,
    };
  });
  player.x = stage.start.x; player.y = stage.start.y;
  player.stepTimer = 0; player.inputMag = 0;
  elapsed = 0; spottedFx = 0;
  state = 'playing';
  hideOverlay();
  document.getElementById('stageLabel').textContent =
    `STAGE ${i+1} — ${stage.name}`;
  document.getElementById('hintVal').textContent = stage.hint;
}

/* ============================================================
   入力
   ============================================================ */
const keys = {};
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  ensureAudio();
  if(k === 'r') retryStage();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
const JOY_MAX = 36;
let joy = {x:0, y:0};
let joyId = null;

function joyMove(e){
  const r = joystick.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width/2);
  const dy = e.clientY - (r.top + r.height/2);
  const dist = Math.hypot(dx,dy);
  const ang = Math.atan2(dy,dx);
  const clamped = Math.min(dist, JOY_MAX);
  knob.style.transform = `translate(${Math.cos(ang)*clamped}px,${Math.sin(ang)*clamped}px)`;
  const n = dist > 5 ? Math.min(dist/JOY_MAX, 1) : 0;
  joy = {x:Math.cos(ang)*n, y:Math.sin(ang)*n};
}
function joyReset(){ joy = {x:0,y:0}; knob.style.transform='translate(0,0)'; }
joystick.addEventListener('pointerdown', e=>{
  ensureAudio();
  joyId = e.pointerId; joystick.setPointerCapture(e.pointerId); joyMove(e);
});
joystick.addEventListener('pointermove', e=>{ if(e.pointerId===joyId) joyMove(e); });
joystick.addEventListener('pointerup', e=>{ if(e.pointerId===joyId){joyId=null; joyReset();} });
joystick.addEventListener('pointercancel', ()=>{ joyId=null; joyReset(); });

/* ============================================================
   音イベント
   ============================================================ */
function emitNoise(x, y, radius, strong){
  noises.push({x, y, r:0, max:radius, life:0, strong:!!strong});
  for(const g of guards){
    if(Math.hypot(g.x-x, g.y-y) <= radius){
      g.mode = 'investigate';
      g.target = {x, y};
      g.alertGlow = 1;
      if(strong) SFX.alert();
    }
  }
}

/* ============================================================
   更新
   ============================================================ */
function update(dt){
  if(state !== 'playing'){ spottedFx = Math.max(0, spottedFx - dt*2); return; }
  elapsed += dt;

  // --- 入力ベクトル ---
  let ix=0, iy=0;
  if(keys['arrowleft']||keys['a']) ix -= 1;
  if(keys['arrowright']||keys['d']) ix += 1;
  if(keys['arrowup']||keys['w']) iy -= 1;
  if(keys['arrowdown']||keys['s']) iy += 1;
  if(keys['shift'] && (ix||iy)){ ix*=0.5; iy*=0.5; }
  ix += joy.x; iy += joy.y;
  const mag = Math.min(Math.hypot(ix,iy), 1);
  player.inputMag = mag;

  let vx=0, vy=0;
  if(mag > 0.02){
    const len = Math.hypot(ix,iy);
    vx = ix/len * mag * WALK_SPEED * dt;
    vy = iy/len * mag * WALK_SPEED * dt;
  }

  // --- 移動と衝突 ---
  moveAxis(vx, 0, mag);
  moveAxis(0, vy, mag);
  player.x = Math.max(B+PLAYER_R, Math.min(W-B-PLAYER_R, player.x));
  player.y = Math.max(B+PLAYER_R, Math.min(H-B-PLAYER_R, player.y));

  // --- 足音 ---
  if(mag > SNEAK_THRESHOLD){
    player.stepTimer -= dt;
    if(player.stepTimer <= 0){
      player.stepTimer = FOOTSTEP_INTERVAL;
      SFX.step();
      emitNoise(player.x, player.y, FOOTSTEP_RADIUS, false);
    }
  } else {
    player.stepTimer = 0.1;
  }

  // --- 倒れた物のアニメ ---
  for(const p of props) if(p.fallen) p.fallT = Math.min(1, p.fallT + dt*4);

  // --- 音の波紋 ---
  for(const n of noises){
    n.life += dt;
    n.r = n.max * Math.min(1, n.life / 0.55);
  }
  noises = noises.filter(n => n.life < 0.8);

  // --- 警備 ---
  for(const g of guards) updateGuard(g, dt);

  // --- ゴール ---
  if(circleRect(player.x, player.y, PLAYER_R, stage.exit)){
    onClear();
    return;
  }

  // --- 発見判定 ---
  for(const g of guards){
    if(canSee(g)){ onCaught(); return; }
  }
}

function moveAxis(vx, vy, mag){
  const nx = player.x + vx, ny = player.y + vy;
  // 壁
  for(const w of walls){
    if(circleRect(nx, ny, PLAYER_R, w)) return;
  }
  // 障害物
  for(const p of props){
    if(p.fallen) continue;
    const d = Math.hypot(nx-p.x, ny-p.y);
    if(d < PLAYER_R + p.r){
      if(mag >= PROP_KNOCK_SPEED){
        p.fallen = true;
        SFX.knock();
        emitNoise(p.x, p.y, PROP_NOISE_RADIUS, true);
      }
      return;
    }
  }
  player.x = nx; player.y = ny;
}

function updateGuard(g, dt){
  g.alertGlow = Math.max(0, g.alertGlow - dt*0.7);

  if(g.mode === 'patrol'){
    patrolStep(g, dt);
    // 首振り（体の向きに対する左右の振り）
    if(g.sweep > 0 && g.sweepT > 0){
      g.sweepPhase += dt * (Math.PI*2 / g.sweepT);
      const want = Math.sin(g.sweepPhase) * Math.min(g.sweep, NECK_LIMIT);
      g.neck = lerpAngle(g.neck, want, 2.2*dt);
    } else {
      g.neck = lerpAngle(g.neck, 0, 2.2*dt);
    }
  }
  else if(g.mode === 'investigate'){
    const dx = g.target.x - g.x, dy = g.target.y - g.y;
    const dist = Math.hypot(dx, dy);
    const want = Math.atan2(dy, dx);
    // 首の可動域内なら首だけ、超えるなら体ごと回る
    const bodyDelta = angDiff(want, g.bodyAngle);
    if(Math.abs(bodyDelta) <= NECK_LIMIT){
      g.neck = lerpAngle(g.neck, bodyDelta, 3.4*dt);
    } else {
      g.neck = lerpAngle(g.neck, Math.sign(bodyDelta)*NECK_LIMIT, 3.4*dt);
      g.bodyAngle = lerpAngle(g.bodyAngle, want, BODY_TURN*dt);
    }
    if(dist > 14){
      const sp = (g.speed > 0 ? g.speed : 56) * 1.25 * dt;
      const stepX = dx/dist*sp, stepY = dy/dist*sp;
      if(!blockedAt(g.x+stepX, g.y+stepY)){ g.x += stepX; g.y += stepY; }
      else { g.mode = 'search'; g.searchTimer = 2.2; }
    } else {
      g.mode = 'search'; g.searchTimer = 2.6;
    }
  }
  else if(g.mode === 'search'){
    g.searchTimer -= dt;
    // 周囲を大きく見回す（首→体の順）
    g.sweepPhase += dt * (Math.PI*2 / 2.0);
    const want = Math.sin(g.sweepPhase) * NECK_LIMIT;
    g.neck = lerpAngle(g.neck, want, 3.6*dt);
    if(Math.abs(g.neck) > NECK_LIMIT*0.92){
      g.bodyAngle += Math.sign(g.neck) * BODY_TURN*0.55 * dt;
    }
    if(g.searchTimer <= 0){
      g.mode = 'patrol';
      g.target = null;
      if(g.speed === 0){ g.bodyAngle = g.homeFace; }
    }
  }
}

function blockedAt(x,y){
  for(const w of walls) if(circleRect(x,y,10,w)) return true;
  for(const p of props) if(!p.fallen && Math.hypot(x-p.x,y-p.y) < 10+p.r) return true;
  return false;
}

function patrolStep(g, dt){
  if(g.speed === 0 || g.path.length < 2){
    g.bodyAngle = lerpAngle(g.bodyAngle, g.homeFace, BODY_TURN*dt);
    return;
  }
  const a = g.path[g.leg];
  const b = g.path[(g.leg+1) % g.path.length];
  const dx = b.x-a.x, dy = b.y-a.y;
  const legLen = Math.hypot(dx,dy);
  g.t += g.speed*dt / legLen;
  if(g.t >= 1){ g.t = 0; g.leg = (g.leg+1) % g.path.length; return; }
  g.x = a.x + dx*g.t;
  g.y = a.y + dy*g.t;
  g.bodyAngle = lerpAngle(g.bodyAngle, Math.atan2(dy,dx), BODY_TURN*1.4*dt);
}

function gazeAngle(g){ return g.bodyAngle + g.neck; }

function canSee(g){
  const dx = player.x - g.x, dy = player.y - g.y;
  const dist = Math.hypot(dx,dy);
  if(dist < 1) return true;
  const ang = Math.atan2(dy,dx);
  const off = Math.abs(angDiff(ang, gazeAngle(g)));
  const inFocus = off <= FOCUS_FOV/2 && dist <= FOCUS_RANGE;
  const inPeri  = off <= PERI_FOV/2  && dist <= PERI_RANGE;
  if(!inFocus && !inPeri) return false;
  return !sightBlocked(g.x, g.y, dx/dist, dy/dist, dist - PLAYER_R*0.8);
}

/* ============================================================
   結果処理
   ============================================================ */
function onCaught(){
  state = 'caught';
  failCount++;
  spottedFx = 1;
  SFX.spotted();
  showOverlay('見つかった', 'caught', stage.hint, [
    {label:'やり直す', cls:'primary', fn:retryStage},
  ]);
}
function onClear(){
  state = 'clear';
  SFX.clear();
  const last = stageIndex === STAGES.length-1;
  if(last){
    showOverlay('全ステージ突破', 'clear',
      `合計失敗 ${failCount} 回。ここまでが1画面版で確認できる範囲です。`, [
      {label:'最初から', cls:'primary', fn:()=>{failCount=0; loadStage(0);}},
    ]);
  } else {
    showOverlay('脱出成功', 'clear',
      `STAGE ${stageIndex+1} クリア ／ ${elapsed.toFixed(1)}秒`, [
      {label:'次のステージ', cls:'primary', fn:()=>loadStage(stageIndex+1)},
      {label:'やり直す', cls:'', fn:retryStage},
    ]);
  }
}
function retryStage(){ loadStage(stageIndex); }

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovNote  = document.getElementById('ovNote');
const ovBtns  = document.getElementById('ovButtons');
function showOverlay(title, cls, note, buttons){
  ovTitle.textContent = title;
  ovTitle.className = 'big ' + cls;
  ovNote.textContent = note || '';
  ovBtns.innerHTML = '';
  for(const b of buttons){
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    el.addEventListener('click', ()=>{ ensureAudio(); b.fn(); });
    ovBtns.appendChild(el);
  }
  overlay.classList.add('show');
}
function hideOverlay(){ overlay.classList.remove('show'); }

/* ============================================================
   描画
   ============================================================ */
function coneShape(g, fov, range){
  const rays = Math.max(12, Math.round(fov/DEG/4));
  const start = gazeAngle(g) - fov/2;
  const step = fov/rays;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y);
  for(let i=0;i<=rays;i++){
    const a = start + step*i;
    const dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(g.x, g.y, dx, dy, range);
    ctx.lineTo(g.x + dx*d, g.y + dy*d);
  }
  ctx.closePath();
}

function drawGuardVision(g){
  // 周辺視野（広く薄く、近距離）
  const pg = ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,PERI_RANGE);
  pg.addColorStop(0,'rgba(255,180,84,0.15)');
  pg.addColorStop(1,'rgba(255,180,84,0.02)');
  coneShape(g, PERI_FOV, PERI_RANGE);
  ctx.fillStyle = pg; ctx.fill();

  // 中心視野（狭く濃く、遠距離）
  const fg = ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,FOCUS_RANGE);
  const boost = g.mode !== 'patrol' ? 0.1 : 0;
  fg.addColorStop(0,`rgba(255,190,110,${0.34+boost})`);
  fg.addColorStop(0.6,`rgba(255,180,84,${0.17+boost})`);
  fg.addColorStop(1,'rgba(255,180,84,0)');
  coneShape(g, FOCUS_FOV, FOCUS_RANGE);
  ctx.fillStyle = fg; ctx.fill();
}

function drawGuardBody(g){
  ctx.save();
  ctx.translate(g.x, g.y);

  // 体（向きがわかる角丸の胴）
  ctx.save();
  ctx.rotate(g.bodyAngle);
  ctx.fillStyle = g.mode==='patrol' ? '#b34a44' : '#e2665c';
  ctx.beginPath();
  ctx.ellipse(0,0,11,8.5,0,0,Math.PI*2);
  ctx.fill();
  // 肩のライン
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-2,-8.5); ctx.lineTo(-2,8.5); ctx.stroke();
  ctx.restore();

  // 頭（首の可動域ぶん回る）
  ctx.save();
  ctx.rotate(gazeAngle(g));
  ctx.fillStyle = '#f6b3ac';
  ctx.beginPath(); ctx.arc(0,0,6.2,0,Math.PI*2); ctx.fill();
  // 鼻先＝視線方向
  ctx.fillStyle = '#fff2ef';
  ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(10.5,-3.2); ctx.lineTo(10.5,3.2); ctx.closePath(); ctx.fill();
  ctx.restore();

  // 警戒マーク
  if(g.mode !== 'patrol'){
    const bob = Math.sin(performance.now()/160)*1.6;
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(g.mode==='investigate' ? '?' : '…', 0, -17 + bob);
  }
  ctx.restore();
}

function drawProp(p){
  ctx.save();
  ctx.translate(p.x, p.y);
  if(p.fallen){
    const t = p.fallT;
    ctx.globalAlpha = 0.55;
    ctx.rotate(0.8*t);
    ctx.scale(1, 0.42 + 0.2*(1-t));
  }
  if(p.kind === 'box'){
    ctx.fillStyle = p.fallen ? '#3a3122' : '#5a4a30';
    ctx.strokeStyle = p.fallen ? '#4a3f2c' : '#7a6540';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.roundRect(-p.r, -p.r, p.r*2, p.r*2, 3);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-p.r,-p.r); ctx.lineTo(p.r,p.r);
    ctx.moveTo(p.r,-p.r); ctx.lineTo(-p.r,p.r);
    ctx.globalAlpha *= 0.4; ctx.stroke();
  } else {
    ctx.fillStyle = p.fallen ? '#2f3a44' : '#47586a';
    ctx.strokeStyle = p.fallen ? '#3d4a56' : '#6c8299';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath(); ctx.arc(0,0,p.r*0.55,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#080b12';
  ctx.fillRect(0,0,W,H);

  // 床のタイル
  ctx.strokeStyle = 'rgba(255,255,255,.022)';
  ctx.lineWidth = 1;
  for(let x=B;x<W-B;x+=46){ ctx.beginPath(); ctx.moveTo(x,B); ctx.lineTo(x,H-B); ctx.stroke(); }
  for(let y=B;y<H-B;y+=46){ ctx.beginPath(); ctx.moveTo(B,y); ctx.lineTo(W-B,y); ctx.stroke(); }

  // 出口
  const pulse = 0.5 + 0.5*Math.sin(elapsed*2.6);
  const E = stage.exit;
  ctx.save();
  ctx.shadowColor = '#5eead4'; ctx.shadowBlur = 16 + pulse*12;
  ctx.fillStyle = 'rgba(94,234,212,.13)';
  ctx.fillRect(E.x,E.y,E.w,E.h);
  ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
  ctx.strokeRect(E.x,E.y,E.w,E.h);
  ctx.restore();
  ctx.fillStyle = 'rgba(94,234,212,.85)';
  ctx.font = '500 12px "Zen Kaku Gothic New",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', E.x+E.w/2, E.y+E.h/2+4);
  ctx.textAlign = 'left';

  // 視野（壁より先に描く）
  for(const g of guards) drawGuardVision(g);

  // 壁
  for(const w of walls){
    ctx.fillStyle = '#1e2637';
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(w.x, w.y, w.w, 2);
    ctx.strokeStyle = '#38425c'; ctx.lineWidth = 1;
    ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1);
  }

  // 障害物
  for(const p of props) drawProp(p);

  // 音の波紋
  for(const n of noises){
    const a = Math.max(0, 1 - n.life/0.8);
    ctx.strokeStyle = n.strong
      ? `rgba(255,209,102,${a*0.75})`
      : `rgba(238,241,245,${a*0.3})`;
    ctx.lineWidth = n.strong ? 2 : 1;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.stroke();
  }

  // 警備
  for(const g of guards) drawGuardBody(g);

  // プレイヤー
  const sneaking = player.inputMag > 0.02 && player.inputMag <= SNEAK_THRESHOLD;
  ctx.save();
  ctx.beginPath(); ctx.arc(player.x,player.y,PLAYER_R,0,Math.PI*2);
  ctx.fillStyle = '#eef1f5';
  ctx.shadowColor = 'rgba(238,241,245,.45)';
  ctx.shadowBlur = sneaking ? 3 : 10;
  ctx.fill();
  ctx.restore();
  if(sneaking){
    ctx.strokeStyle = 'rgba(94,234,212,.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(player.x,player.y,PLAYER_R+5,0,Math.PI*2); ctx.stroke();
  }

  // 発見時の赤フラッシュ
  if(spottedFx > 0){
    ctx.fillStyle = `rgba(226,102,92,${spottedFx*0.3})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ============================================================
   ループ
   ============================================================ */
const timeVal = document.getElementById('timeVal');
const failVal = document.getElementById('failVal');
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  timeVal.textContent = elapsed.toFixed(1);
  failVal.textContent = failCount;
  requestAnimationFrame(loop);
}

loadStage(0);
requestAnimationFrame(loop);
</script>
