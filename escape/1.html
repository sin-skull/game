<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>脱出プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060a;
    --shell:#0a0d14;
    --shell-hi:#151b28;
    --seam:#232c3e;
    --ink:#e8ecf2;
    --ink-dim:#6f798d;
    --lamp:#ffc46b;
    --exit:#57e0b8;
    --blood:#d9564c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;min-height:100%;
    background:
      radial-gradient(120% 80% at 50% -10%, #121826 0%, #05070b 60%, #04060a 100%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
    user-select:none;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    padding:14px;min-height:100vh;
  }

  .console{
    width:100%;max-width:760px;
    display:flex;flex-direction:column;gap:9px;
  }

  /* ---------- 上画面 ---------- */
  .upper{
    position:relative;
    border-radius:6px 6px 3px 3px;
    background:var(--void);
    padding:9px;
    box-shadow:
      inset 0 0 0 1px #000,
      0 0 0 1px var(--seam),
      0 10px 30px rgba(0,0,0,.6);
    background-image:linear-gradient(180deg,#141a26,#0a0e16);
  }
  .screen{
    position:relative;
    border-radius:2px;
    overflow:hidden;
    background:#04060a;
    box-shadow:inset 0 0 0 1px #000, inset 0 0 24px rgba(0,0,0,.9);
  }
  canvas{display:block;width:100%;height:auto;}

  .hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:9px 11px;
    font-size:11px;letter-spacing:.04em;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);
  }
  .hud .left{line-height:1.65;}
  .hud .title{color:var(--ink);font-weight:500;font-size:12px;}
  .hud .hint{color:var(--ink-dim);}
  .hud .right{text-align:right;line-height:1.65;color:var(--ink-dim);}
  .hud .right b{color:var(--ink);font-weight:500;}

  .overlay{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:13px;
    background:rgba(3,5,9,.88);padding:22px;text-align:center;
  }
  .overlay.show{display:flex;}
  .ov-title{font-size:24px;font-weight:700;letter-spacing:.06em;}
  .ov-title.caught{color:var(--blood);text-shadow:0 0 22px rgba(217,86,76,.45);}
  .ov-title.clear{color:var(--exit);text-shadow:0 0 22px rgba(87,224,184,.4);}
  .ov-note{font-size:12.5px;color:var(--ink-dim);line-height:1.8;max-width:30em;}
  .ov-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}

  /* ---------- ヒンジ ---------- */
  .hinge{
    height:11px;margin:0 34px;border-radius:0 0 5px 5px;
    background:linear-gradient(180deg,#1b2231,#0b0f17);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.6);
  }

  /* ---------- 下画面（操作盤） ---------- */
  .lower{
    border-radius:3px 3px 7px 7px;
    padding:13px;
    background-image:linear-gradient(180deg,#0f1520,#080b12);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.045),
      0 0 0 1px var(--seam),
      0 10px 26px rgba(0,0,0,.55);
    display:grid;
    grid-template-columns:150px 1fr auto;
    gap:13px;align-items:center;
  }
  @media (max-width:560px){
    .lower{grid-template-columns:132px 1fr;grid-template-areas:'pad info' 'pad btns';}
    .pad-zone{grid-area:pad;}
    .readout{grid-area:info;}
    .buttons{grid-area:btns;justify-self:stretch;}
  }

  .pad-zone{
    position:relative;
    height:150px;
    border-radius:8px;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.035), transparent 65%),
      #070a11;
    box-shadow:inset 0 0 0 1px #1b2231, inset 0 2px 10px rgba(0,0,0,.8);
    touch-action:none;
    display:flex;align-items:center;justify-content:center;
  }
  .pad-hint{
    position:absolute;bottom:8px;left:0;right:0;
    text-align:center;font-size:9.5px;color:#4b5468;letter-spacing:.06em;
    pointer-events:none;
  }
  .pad-base{
    position:absolute;width:96px;height:96px;border-radius:50%;
    border:1px solid rgba(255,255,255,.09);
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.045), transparent 70%);
    pointer-events:none;opacity:.85;transition:opacity .15s;
  }
  .pad-inner{
    position:absolute;width:52px;height:52px;border-radius:50%;
    border:1px dashed rgba(87,224,184,.3);
    pointer-events:none;
  }
  .pad-knob{
    position:absolute;width:42px;height:42px;border-radius:50%;
    background:
      radial-gradient(circle at 42% 34%, #46536c, #222c3e 70%);
    box-shadow:0 2px 7px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.16);
    pointer-events:none;
  }

  .readout{
    align-self:stretch;
    display:flex;flex-direction:column;justify-content:center;gap:7px;
    min-width:0;
  }
  .gait{
    display:flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.05em;
  }
  .gait .lamp{
    width:8px;height:8px;border-radius:50%;
    background:#2b3444;box-shadow:none;transition:.12s;
  }
  .gait.sneak .lamp{background:var(--exit);box-shadow:0 0 9px var(--exit);}
  .gait.walk  .lamp{background:var(--lamp);box-shadow:0 0 9px var(--lamp);}
  .gait .label{color:var(--ink-dim);}
  .gait.sneak .label{color:var(--exit);}
  .gait.walk  .label{color:var(--lamp);}

  .alertbar{
    height:5px;border-radius:3px;background:#151b28;overflow:hidden;
    box-shadow:inset 0 0 0 1px #1e2635;
  }
  .alertbar i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--lamp),var(--blood));
    transition:width .2s;
  }
  .alerttext{font-size:10.5px;color:var(--ink-dim);letter-spacing:.04em;}

  .buttons{display:flex;flex-direction:column;gap:7px;}
  .btn{
    padding:9px 17px;border-radius:5px;
    border:1px solid #26314a;
    background:linear-gradient(180deg,#1a2234,#111724);
    color:var(--ink);font-family:inherit;font-size:12.5px;
    letter-spacing:.05em;cursor:pointer;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .btn:active{background:#0d1320;transform:translateY(1px);}
  .btn.go{border-color:rgba(87,224,184,.5);color:var(--exit);}
  .btn.small{padding:7px 13px;font-size:11.5px;}

  .legend{
    display:flex;gap:13px;flex-wrap:wrap;justify-content:center;
    font-size:10.5px;color:#57617a;letter-spacing:.03em;
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}
</style>
</head>

</div>

/* ==========================================================
   音
   ========================================================== */
let ac = null;
function audioOn(){
  if(!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) ac = new AC();
  }
  if(ac && ac.state === 'suspended') ac.resume();
}
function osc(freq,dur,type,gain,to){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise(dur,gain,cut,type){
  if(!ac) return;
  const t = ac.currentTime;
  const n = Math.max(1,(ac.sampleRate*dur)|0);
  const buf = ac.createBuffer(1,n,ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,1.6);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = cut||1200;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
}
const SFX = {

  glass(){ noise(.42,.28,6500,'highpass'); osc(2100,.28,'triangle',.1,900); },
  step(){ noise(.045,.045,520); },
  spot(){ osc(920,.55,'sawtooth',.2,150); },
  clear(){ osc(523,.15,'sine',.16); setTimeout(()=>osc(784,.4,'sine',.16),130); },
  notice(){ osc(430,.16,'square',.06,560); },
};

/* ==========================================================
   幾何
   ========================================================== */
function circleRect(cx,cy,r,R){
  const nx = Math.max(R.x,Math.min(cx,R.x+R.w));
  const ny = Math.max(R.y,Math.min(cy,R.y+R.h));
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}
function rayRect(ox,oy,dx,dy,R){
  let tmin=0, tmax=Infinity;
  const ix = dx!==0?1/dx:1e9, iy = dy!==0?1/dy:1e9;
  let a=(R.x-ox)*ix, b=(R.x+R.w-ox)*ix; if(a>b){const s=a;a=b;b=s;}
  tmin=Math.max(tmin,a); tmax=Math.min(tmax,b);
  let c=(R.y-oy)*iy, d=(R.y+R.h-oy)*iy; if(c>d){const s=c;c=d;d=s;}
  tmin=Math.max(tmin,c); tmax=Math.min(tmax,d);
  return (tmax>=tmin && tmax>=0) ? (tmin>0?tmin:0) : Infinity;
}
function rayCircle(ox,oy,dx,dy,cx,cy,r){
  const ex=ox-cx, ey=oy-cy;
  const b=ex*dx+ey*dy, c=ex*ex+ey*ey-r*r;
  if(c>0 && b>0) return Infinity;
  const disc=b*b-c;
  if(disc<0) return Infinity;
  const t=-b-Math.sqrt(disc);
  return t>=0?t:0;
}
function angDiff(a,b){
  let d=a-b;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  return d;
}
function toward(cur,tgt,step){
  const d=angDiff(tgt,cur);
  return Math.abs(d)<=step ? tgt : cur+Math.sign(d)*step;
}

/* ==========================================================
   状態
   ========================================================== */
let stageIdx = 0, stage = null;
let walls=[], props=[], guards=[], noises=[];
const player = {x:0,y:0,face:-Math.PI/2,mag:0,step:0,bob:0};
let mode='playing';   // playing | caught | clear | menu
let elapsed=0, fails=0, flash=0;
let unlocked = 1;

function standing(){ return props.filter(p=>!p.down); }

function rayDist(ox,oy,dx,dy,max){
  let best=max;
  for(const w of walls){ const t=rayRect(ox,oy,dx,dy,w); if(t<best) best=t; }
  for(const p of standing()){ const t=rayCircle(ox,oy,dx,dy,p.x,p.y,p.r); if(t<best) best=t; }
  return best;
}
function blocked(ox,oy,dx,dy,dist){
  for(const w of walls){ if(rayRect(ox,oy,dx,dy,w)<dist) return true; }
  for(const p of standing()){ if(rayCircle(ox,oy,dx,dy,p.x,p.y,p.r)<dist) return true; }
  return false;
}

function loadStage(i){
  stageIdx=i; stage=STAGES[i];
  walls = stage.walls.map(w=>({...w}));
  props = stage.props.map(p=>({...p, down:false, t:0, spin:(Math.random()-.5)*1.4}));
  noises = [];
  guards = stage.guards.map(g=>{
    const p0=g.path[0];
    const face = g.face!==undefined ? g.face
      : (g.path.length>1 ? Math.atan2(g.path[1].y-p0.y,g.path[1].x-p0.x) : 0);
    return {
      x:p0.x, y:p0.y, path:g.path.map(p=>({...p})), leg:0, t:0,
      speed:g.speed||0, sweep:g.sweep||0, sweepT:g.sweepT||0,
      phase:Math.random()*Math.PI*2,
      home:face, body:face, neck:0,
      state:'patrol', target:null, timer:0, glow:0,
    };
  });
  player.x=stage.start.x; player.y=stage.start.y;
  player.face=-Math.PI/2; player.mag=0; player.step=0;
  elapsed=0; flash=0; mode='playing';
  hideOverlay();
  document.getElementById('hudTitle').textContent = `STAGE ${i+1} ／ ${stage.name}`;
  document.getElementById('hudHint').textContent = stage.hint;
}

// フローティング・スティック（パネル内のどこを触っても出る）
const padZone = document.getElementById('padZone');
const padBase = document.getElementById('padBase');
const padKnob = document.getElementById('padKnob');
const KNOB_MAX = 34;
let joy={x:0,y:0}, padId=null, padOrigin={x:0,y:0};

function placeStick(cx,cy){
  const r=padZone.getBoundingClientRect();
  padBase.style.left = (cx-r.left-48)+'px';
  padBase.style.top  = (cy-r.top-48)+'px';
  padBase.style.transform='none';
  padKnob.style.left = (cx-r.left-21)+'px';
  padKnob.style.top  = (cy-r.top-21)+'px';
  padKnob.style.transform='none';
}
function moveStick(e){
  const dx=e.clientX-padOrigin.x, dy=e.clientY-padOrigin.y;
  const dist=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
  const cl=Math.min(dist,KNOB_MAX);
  const r=padZone.getBoundingClientRect();
  padKnob.style.left=(padOrigin.x-r.left-21+Math.cos(ang)*cl)+'px';
  padKnob.style.top =(padOrigin.y-r.top -21+Math.sin(ang)*cl)+'px';
  const n = dist>4 ? Math.min(dist/KNOB_MAX,1) : 0;
  joy={x:Math.cos(ang)*n, y:Math.sin(ang)*n};
}
function releaseStick(){
  joy={x:0,y:0}; padId=null;
  padBase.style.left='50%'; padBase.style.top='50%';
  padBase.style.transform='translate(-50%,-50%)';
  padKnob.style.left='50%'; padKnob.style.top='50%';
  padKnob.style.transform='translate(-50%,-50%)';
}
padZone.addEventListener('pointerdown',e=>{
  audioOn();
  padId=e.pointerId; padZone.setPointerCapture(e.pointerId);
  padOrigin={x:e.clientX,y:e.clientY};
  placeStick(e.clientX,e.clientY);
});
padZone.addEventListener('pointermove',e=>{ if(e.pointerId===padId) moveStick(e); });
padZone.addEventListener('pointerup',e=>{ if(e.pointerId===padId) releaseStick(); });
padZone.addEventListener('pointercancel',()=>releaseStick());
releaseStick();

/* ==========================================================
   音イベント
   ========================================================== */
function emit(x,y,radius,strong){
  noises.push({x,y,r:0,max:radius,life:0,strong});
  for(const g of guards){
    if(Math.hypot(g.x-x,g.y-y)<=radius){
      g.state='investigate'; g.target={x,y}; g.glow=1;
      if(strong) SFX.notice();
    }
  }
}

/* ==========================================================
   更新
   ========================================================== */
function update(dt){
  if(mode!=='playing'){ flash=Math.max(0,flash-dt*1.8); return; }
  elapsed+=dt;

  let ix=0,iy=0;
  if(keys['arrowleft']||keys['a']) ix-=1;
  if(keys['arrowright']||keys['d']) ix+=1;
  if(keys['arrowup']||keys['w']) iy-=1;
  if(keys['arrowdown']||keys['s']) iy+=1;
  if(keys['shift']&&(ix||iy)){ ix*=.5; iy*=.5; }
  ix+=joy.x; iy+=joy.y;
  const mag=Math.min(Math.hypot(ix,iy),1);
  player.mag=mag;

  if(mag>.02){
    const L=Math.hypot(ix,iy);
    player.face = toward(player.face, Math.atan2(iy,ix), 9*dt);
    step(ix/L*mag*WALK_SPEED*dt, 0, mag);
    step(0, iy/L*mag*WALK_SPEED*dt, mag);
    player.bob += dt*mag*11;
  }
  player.x=Math.max(B+PR,Math.min(W-B-PR,player.x));
  player.y=Math.max(B+PR,Math.min(H-B-PR,player.y));

  if(mag>SNEAK_MAX){
    player.step-=dt;
    if(player.step<=0){ player.step=STEP_INT; SFX.step(); emit(player.x,player.y,STEP_RADIUS,false); }
  } else player.step=.12;

  for(const p of props) if(p.down) p.t=Math.min(1,p.t+dt*4.5);
  for(const n of noises){ n.life+=dt; n.r=n.max*Math.min(1,n.life/.5); }
  noises=noises.filter(n=>n.life<.85);

  for(const g of guards) guardStep(g,dt);

  if(circleRect(player.x,player.y,PR,stage.exit)){ onClear(); return; }
  for(const g of guards) if(sees(g)){ onCaught(); return; }
}

function step(vx,vy,mag){
  const nx=player.x+vx, ny=player.y+vy;
  for(const w of walls) if(circleRect(nx,ny,PR,w)) return;
  for(const p of props){
    if(p.down) continue;
    if(Math.hypot(nx-p.x,ny-p.y) < PR+p.r){
      if(mag>=KNOCK_MAG){
        p.down=true;
        SFX[p.sound]();
        emit(p.x,p.y,p.noise,true);
      }
      return;
    }
  }
  player.x=nx; player.y=ny;
}

function guardStep(g,dt){
  g.glow=Math.max(0,g.glow-dt*.6);

  if(g.state==='patrol'){
    patrol(g,dt);
    if(g.sweep>0 && g.sweepT>0){
      g.phase += dt*(Math.PI*2/g.sweepT);
      g.neck = toward(g.neck, Math.sin(g.phase)*Math.min(g.sweep,NECK_LIMIT), 2.2*dt);
    } else g.neck = toward(g.neck, 0, 2.2*dt);
  }
  else if(g.state==='investigate'){
    const dx=g.target.x-g.x, dy=g.target.y-g.y;
    const dist=Math.hypot(dx,dy), want=Math.atan2(dy,dx);
    const bd=angDiff(want,g.body);
    if(Math.abs(bd)<=NECK_LIMIT){
      g.neck=toward(g.neck,bd,3.4*dt);
    } else {
      g.neck=toward(g.neck,Math.sign(bd)*NECK_LIMIT,3.4*dt);
      g.body=toward(g.body,want,BODY_TURN*dt);
    }
    if(dist>14){
      const sp=(g.speed>0?g.speed:56)*1.3*dt;
      const nx=g.x+dx/dist*sp, ny=g.y+dy/dist*sp;
      if(!solid(nx,ny)){ g.x=nx; g.y=ny; }
      else { g.state='search'; g.timer=2.2; }
    } else { g.state='search'; g.timer=2.8; }
  }
  else {
    g.timer-=dt;
    g.phase+=dt*(Math.PI*2/2.0);
    g.neck=toward(g.neck, Math.sin(g.phase)*NECK_LIMIT, 3.6*dt);
    if(Math.abs(g.neck)>NECK_LIMIT*.9) g.body += Math.sign(g.neck)*BODY_TURN*.55*dt;
    if(g.timer<=0){
      g.state='patrol'; g.target=null;
      if(g.speed===0) g.body=g.home;
    }
  }
}
function solid(x,y){
  for(const w of walls) if(circleRect(x,y,10,w)) return true;
  for(const p of standing()) if(Math.hypot(x-p.x,y-p.y)<10+p.r) return true;
  return false;
}
function patrol(g,dt){
  if(g.speed===0||g.path.length<2){ g.body=toward(g.body,g.home,BODY_TURN*dt); return; }
  const a=g.path[g.leg], b=g.path[(g.leg+1)%g.path.length];
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  g.t += g.speed*dt/len;
  if(g.t>=1){ g.t=0; g.leg=(g.leg+1)%g.path.length; return; }
  g.x=a.x+dx*g.t; g.y=a.y+dy*g.t;
  g.body=toward(g.body,Math.atan2(dy,dx),BODY_TURN*1.5*dt);
}
function gaze(g){ return g.body+g.neck; }

function sees(g){
  const dx=player.x-g.x, dy=player.y-g.y;
  const d=Math.hypot(dx,dy);
  if(d<1) return true;
  const off=Math.abs(angDiff(Math.atan2(dy,dx),gaze(g)));
  const inFocus = off<=FOCUS_FOV/2 && d<=FOCUS_RANGE;
  const inPeri  = off<=PERI_FOV/2  && d<=PERI_RANGE;
  if(!inFocus&&!inPeri) return false;
  return !blocked(g.x,g.y,dx/d,dy/d,d-PR*.8);
}

/* ==========================================================
   描画
   ========================================================== */
function coneShape(g,fov,range){
  const n=Math.max(14,Math.round(fov/DEG/4));
  const s=gaze(g)-fov/2, st=fov/n;
  ctx.beginPath(); ctx.moveTo(g.x,g.y);
  for(let i=0;i<=n;i++){
    const a=s+st*i, dx=Math.cos(a), dy=Math.sin(a);
    const d=rayDist(g.x,g.y,dx,dy,range);
    ctx.lineTo(g.x+dx*d, g.y+dy*d);
  }
  ctx.closePath();
}

/* --- 床 --- */
function drawFloor(lit){
  const size=44;
  for(let y=B;y<H-B;y+=size){
    for(let x=B;x<W-B;x+=size){
      const n=((x*7+y*13)%5)/5;
      const base = lit ? 26+n*9 : 10+n*3;
      ctx.fillStyle = `rgb(${base+3},${base+2},${base+6})`;
      ctx.fillRect(x,y,size-1,size-1);
    }
  }
  // 目地
  ctx.strokeStyle = lit ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.5)';
  ctx.lineWidth=1;
  for(let x=B;x<W-B;x+=size){ ctx.beginPath(); ctx.moveTo(x+.5,B); ctx.lineTo(x+.5,H-B); ctx.stroke(); }
  for(let y=B;y<H-B;y+=size){ ctx.beginPath(); ctx.moveTo(B,y+.5); ctx.lineTo(W-B,y+.5); ctx.stroke(); }
}

/* --- 壁 --- */
function drawWalls(lit){
  for(const w of walls){
    ctx.fillStyle = lit ? '#4b5568' : '#161c28';
    ctx.fillRect(w.x,w.y,w.w,w.h);
    // 天面のハイライト
    ctx.fillStyle = lit ? 'rgba(255,225,180,.3)' : 'rgba(255,255,255,.055)';
    ctx.fillRect(w.x,w.y,w.w,3);
    // ブロックの割り
    ctx.strokeStyle = lit ? 'rgba(0,0,0,.28)' : 'rgba(0,0,0,.4)';
    ctx.lineWidth=1;
    if(w.w>w.h){
      for(let x=w.x+34;x<w.x+w.w;x+=34){ ctx.beginPath(); ctx.moveTo(x+.5,w.y); ctx.lineTo(x+.5,w.y+w.h); ctx.stroke(); }
    } else {
      for(let y=w.y+34;y<w.y+w.h;y+=34){ ctx.beginPath(); ctx.moveTo(w.x,y+.5); ctx.lineTo(w.x+w.w,y+.5); ctx.stroke(); }
    }
    ctx.strokeStyle = lit ? 'rgba(255,220,170,.18)' : 'rgba(120,140,180,.16)';
    ctx.strokeRect(w.x+.5,w.y+.5,w.w-1,w.h-1);
  }
}

/* --- 物 --- */
function drawProp(p,lit){
  ctx.save();
  ctx.translate(p.x,p.y);
  if(p.down){
    ctx.globalAlpha = .8;
    ctx.rotate(p.spin*p.t);
    ctx.scale(1, .46+.16*(1-p.t));
  }
  const a = lit?1:0;
  const col = (l,d)=> lit?l:d;

  if(p.kind==='crate'||p.kind==='crateL'){
    const s=p.r;
    ctx.fillStyle=col('#8a6a3c','#241d13');
    ctx.fillRect(-s,-s,s*2,s*2);
    ctx.strokeStyle=col('#5d4526','#151009'); ctx.lineWidth=2;
    ctx.strokeRect(-s,-s,s*2,s*2);
    // 板目
    ctx.strokeStyle=col('rgba(80,58,30,.85)','rgba(10,8,5,.8)'); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(-s,-s*.33); ctx.lineTo(s,-s*.33);
    ctx.moveTo(-s,s*.33); ctx.lineTo(s,s*.33); ctx.stroke();
    // 対角の補強
    ctx.strokeStyle=col('rgba(120,90,50,.7)','rgba(30,24,15,.8)');
    ctx.beginPath(); ctx.moveTo(-s,-s); ctx.lineTo(s,s); ctx.stroke();
  }
  else if(p.kind==='barrel'){
    ctx.fillStyle=col('#4f6472','#151b21');
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=col('#8fa8b8','#232d36'); ctx.lineWidth=2;
    ctx.stroke();
    ctx.lineWidth=1.4;
    ctx.strokeStyle=col('rgba(190,215,230,.6)','rgba(50,64,78,.7)');
    ctx.beginPath(); ctx.arc(0,0,p.r*.62,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,p.r*.3,0,Math.PI*2); ctx.stroke();
    if(lit){
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.arc(-p.r*.34,-p.r*.34,p.r*.26,0,Math.PI*2); ctx.fill();
    }
  }
  else if(p.kind==='vase'){
    ctx.fillStyle=col('#6d5a86','#1b1624');
    ctx.beginPath();
    ctx.ellipse(0,p.r*.18,p.r,p.r*.92,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=col('#8a75a6','#241d30');
    ctx.beginPath();
    ctx.ellipse(0,-p.r*.72,p.r*.46,p.r*.3,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=col('rgba(215,195,240,.55)','rgba(60,50,78,.7)'); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.ellipse(0,p.r*.18,p.r,p.r*.92,0,0,Math.PI*2); ctx.stroke();
  }
  else if(p.kind==='chair'){
    const s=p.r;
    ctx.fillStyle=col('#7b5f3e','#1f1810');
    ctx.fillRect(-s*.8,-s*.55,s*1.6,s*1.3);
    ctx.strokeStyle=col('#4e3b24','#120e08'); ctx.lineWidth=1.6;
    ctx.strokeRect(-s*.8,-s*.55,s*1.6,s*1.3);
    // 背もたれ
    ctx.fillStyle=col('#6b5134','#1a140d');
    ctx.fillRect(-s*.8,-s,s*1.6,s*.36);
    ctx.strokeRect(-s*.8,-s,s*1.6,s*.36);
    // 脚
    ctx.fillStyle=col('rgba(60,45,26,.9)','rgba(12,9,6,.9)');
    for(const [ox,oy] of [[-s*.66,-s*.34],[s*.5,-s*.34],[-s*.66,s*.56],[s*.5,s*.56]])
      ctx.fillRect(ox,oy,s*.2,s*.2);
  }
  else if(p.kind==='cart'){
    const s=p.r;
    ctx.fillStyle=col('#53616f','#161b21');
    ctx.fillRect(-s,-s*.62,s*2,s*1.24);
    ctx.strokeStyle=col('#8ea2b4','#222a33'); ctx.lineWidth=1.8;
    ctx.strokeRect(-s,-s*.62,s*2,s*1.24);
    ctx.strokeStyle=col('rgba(180,200,220,.5)','rgba(45,56,68,.75)'); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-s*.35,-s*.62); ctx.lineTo(-s*.35,s*.62);
    ctx.moveTo(s*.35,-s*.62); ctx.lineTo(s*.35,s*.62); ctx.stroke();
    // 車輪
    ctx.fillStyle=col('#2c3540','#0c1014');
    for(const [ox,oy] of [[-s*.72,-s*.72],[s*.72,-s*.72],[-s*.72,s*.72],[s*.72,s*.72]]){
      ctx.beginPath(); ctx.arc(ox,oy,s*.26,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* --- 非常口 --- */
function drawExit(){
  const E=stage.exit;
  const pulse=.5+.5*Math.sin(elapsed*2.4);
  ctx.save();
  // ドア枠
  ctx.fillStyle='#0e1a18';
  ctx.fillRect(E.x,E.y,E.w,E.h);
  const g=ctx.createLinearGradient(E.x,E.y,E.x,E.y+E.h);
  g.addColorStop(0,`rgba(87,224,184,${.2+pulse*.14})`);
  g.addColorStop(1,'rgba(87,224,184,.04)');
  ctx.fillStyle=g; ctx.fillRect(E.x,E.y,E.w,E.h);
  ctx.shadowColor='#57e0b8'; ctx.shadowBlur=14+pulse*12;
  ctx.strokeStyle='#57e0b8'; ctx.lineWidth=2;
  ctx.strokeRect(E.x+1,E.y+1,E.w-2,E.h-2);
  ctx.restore();
  // ピクトグラム（走る人）
  const cx=E.x+E.w/2, cy=E.y+E.h/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle=`rgba(87,224,184,${.6+pulse*.35})`;
  ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(-3,-13,3.4,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-3,-8); ctx.lineTo(-1,0);          // 胴
  ctx.moveTo(-1,0);  ctx.lineTo(-8,9);          // 後ろ脚
  ctx.moveTo(-1,0);  ctx.lineTo(7,7);           // 前脚
  ctx.moveTo(-3,-5); ctx.lineTo(-11,-2);        // 後ろ腕
  ctx.moveTo(-3,-5); ctx.lineTo(5,-7);          // 前腕
  ctx.stroke();
  ctx.restore();
}

/* --- 警備員 --- */
function drawGuard(g,lit){
  ctx.save();
  ctx.translate(g.x,g.y);

  // 影
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(1.5,2.5,12,10,0,0,Math.PI*2); ctx.fill();

  // 胴（体の向き）
  ctx.save(); ctx.rotate(g.body);
  ctx.fillStyle = g.state==='patrol' ? '#3c4658' : '#4a4048';
  ctx.beginPath(); ctx.ellipse(0,0,11.5,9,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1b2230'; ctx.lineWidth=1.4; ctx.stroke();
  // 制服の襟ライン
  ctx.strokeStyle='rgba(217,86,76,.85)'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(-1,-8.6); ctx.lineTo(-1,8.6); ctx.stroke();
  ctx.restore();

  // 頭・帽子・懐中電灯（視線の向き）
  ctx.save(); ctx.rotate(gaze(g));
  // 腕＋懐中電灯
  ctx.strokeStyle='#2c3545'; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(2,5); ctx.lineTo(11,4); ctx.stroke();
  ctx.fillStyle='#c9cfd8';
  ctx.fillRect(10,1.6,6.5,4.6);
  ctx.fillStyle='#ffe2ac';
  ctx.fillRect(16,2.2,2.2,3.4);
  // 頭
  ctx.fillStyle='#e9b9a6';
  ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  // 制帽
  ctx.fillStyle='#232c3c';
  ctx.beginPath(); ctx.arc(0,0,6.2,-Math.PI*.62,Math.PI*.62,true); ctx.fill();
  ctx.fillStyle='#171e2a';
  ctx.beginPath(); ctx.ellipse(4.6,0,3.4,5.2,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 状態マーク
  if(g.state!=='patrol'){
    const bob=Math.sin(performance.now()/150)*1.8;
    ctx.fillStyle='#ffd27a';
    ctx.font='bold 15px system-ui'; ctx.textAlign='center';
    ctx.fillText(g.state==='investigate'?'?':'…',0,-19+bob);
    ctx.textAlign='left';
  }
  ctx.restore();
}

/* --- プレイヤー --- */
function drawPlayer(){
  const sneak = player.mag>.02 && player.mag<=SNEAK_MAX;
  const bob = Math.sin(player.bob)*0.9*(player.mag>.02?1:0);
  ctx.save();
  ctx.translate(player.x,player.y+bob);

  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(1,3,9.5,7.5,0,0,Math.PI*2); ctx.fill();

  ctx.rotate(player.face);
  // フードのシルエット
  ctx.fillStyle = sneak ? '#242c3c' : '#2f3a4e';
  ctx.beginPath(); ctx.ellipse(-1,0,9,7.5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = sneak ? 'rgba(87,224,184,.55)' : 'rgba(200,215,235,.5)';
  ctx.lineWidth=1.3; ctx.stroke();
  // フードの先
  ctx.fillStyle = sneak ? '#1b2230' : '#232c3c';
  ctx.beginPath();
  ctx.moveTo(3,-5.4); ctx.quadraticCurveTo(11,0,3,5.4); ctx.closePath(); ctx.fill();
  ctx.restore();

  if(sneak){
    ctx.strokeStyle='rgba(87,224,184,.35)'; ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.arc(player.x,player.y,PR+6,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* --- メイン描画 --- */
function draw(){
  // 1) 暗いベース
  ctx.fillStyle='#04060a'; ctx.fillRect(0,0,W,H);
  drawFloor(false);
  drawWalls(false);
  for(const p of props) drawProp(p,false);
  drawExit();

  // 2) 各懐中電灯で照らされた部分だけ、明るい版を描く
  for(const g of guards){
    // 周辺視野（弱い環境認知）
    ctx.save();
    coneShape(g,PERI_FOV,PERI_RANGE);
    ctx.clip();
    ctx.globalAlpha=.5;
    drawFloor(true); drawWalls(true);
    for(const p of props) drawProp(p,true);
    ctx.globalAlpha=1;
    const pg=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,PERI_RANGE);
    pg.addColorStop(0,'rgba(255,196,107,.13)');
    pg.addColorStop(1,'rgba(255,196,107,0)');
    ctx.fillStyle=pg; ctx.fillRect(0,0,W,H);
    ctx.restore();

    // 中心視野＝懐中電灯の本体光
    ctx.save();
    coneShape(g,FOCUS_FOV,FOCUS_RANGE);
    ctx.clip();
    drawFloor(true); drawWalls(true);
    for(const p of props) drawProp(p,true);
    const fg=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,FOCUS_RANGE);
    const boost = g.state!=='patrol' ? .08 : 0;
    fg.addColorStop(0,`rgba(255,214,150,${.36+boost})`);
    fg.addColorStop(.55,`rgba(255,196,107,${.2+boost})`);
    fg.addColorStop(1,'rgba(255,196,107,0)');
    ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    // 光の縁
    ctx.restore();
    ctx.save();
    coneShape(g,FOCUS_FOV,FOCUS_RANGE);
    ctx.strokeStyle='rgba(255,214,150,.22)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }

  // 3) 音の波紋
  for(const n of noises){
    const a=Math.max(0,1-n.life/.85);
    ctx.strokeStyle = n.strong ? `rgba(255,210,122,${a*.8})` : `rgba(220,232,245,${a*.3})`;
    ctx.lineWidth = n.strong?2:1;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.stroke();
    if(n.strong){
      ctx.strokeStyle=`rgba(255,210,122,${a*.4})`;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*.6,0,Math.PI*2); ctx.stroke();
    }
  }

  // 4) 警備員とプレイヤー
  for(const g of guards) drawGuard(g,false);
  drawPlayer();

  // 5) 画面の縁を落として奥行きを出す
  const vig=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.92);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,.66)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  if(flash>0){
    ctx.fillStyle=`rgba(217,86,76,${flash*.34})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ==========================================================
   下画面の表示更新
   ========================================================== */
const gaitEl=document.getElementById('gait');
const gaitLabel=document.getElementById('gaitLabel');
const alertFill=document.getElementById('alertFill');
const alertText=document.getElementById('alertText');
const hudTime=document.getElementById('hudTime');
const hudFail=document.getElementById('hudFail');

function updatePanel(){
  const m=player.mag;
  let cls='', label='停止';
  if(m>SNEAK_MAX){ cls='walk'; label='歩行 — 足音が出ている'; }
  else if(m>.02){ cls='sneak'; label='忍び足 — 無音'; }
  gaitEl.className='gait '+cls;
  gaitLabel.textContent=label;

  const alerted=guards.filter(g=>g.state!=='patrol').length;
  const pct = guards.length ? (alerted/guards.length)*100 : 0;
  alertFill.style.width=pct+'%';
  alertText.textContent = alerted===0
    ? `警戒なし ／ 警備 ${guards.length}`
    : `${alerted} 人が音を追っている`;

  hudTime.textContent=elapsed.toFixed(1);
  hudFail.textContent=fails;
}

/* ==========================================================
   ループ
   ========================================================== */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  updatePanel();
  requestAnimationFrame(loop);
}
loadStage(0);
requestAnimationFrame(loop);
</script>
