<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHYTHM FEEL - プレイ実機</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; height: 100dvh; width: 100vw; overflow: hidden; touch-action: none; user-select: none; }
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; align-items: center; justify-content: center; position: relative; }
        .active { display: flex !important; }
        h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); text-align: center; color: #00ffcc; margin: 20px 0; letter-spacing: 2px; }
        .btn { background: #00ffcc; color: #000; font-weight: bold; font-size: clamp(1rem, 4vw, 1.2rem); padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,255,204,0.2); width: 80%; max-width: 300px; margin: 10px auto; }
        .btn:active { background: #00cc99; transform: translateY(2px); box-shadow: none; }
        .btn-cancel { background: #444; color: #fff; box-shadow: none; }
        .btn-cancel:active { background: #333; }
        
        #loading-message { color: #aaa; margin-top: 20px; text-align: center; line-height: 1.5; }
        .song-list { width: 90%; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; margin-top: 10px; padding-bottom: 20px; }
        .song-btn { background: #222; border: 1px solid #444; border-radius: 10px; padding: 20px; text-align: left; cursor: pointer; transition: 0.2s; }
        .song-btn:active { background: #333; border-color: #00ffcc; }
        .song-title { font-size: 1.3rem; color: #fff; font-weight: bold; margin-bottom: 5px; }
        .song-bpm { font-size: 0.9rem; color: #00ffcc; }
        
        #popup-overlay { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .popup-box { background: #1a1a1a; border: 2px solid #00ffcc; border-radius: 15px; width: 85%; max-width: 400px; padding: 30px; text-align: center; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        #popup-title { font-size: 1.5rem; color: #fff; margin-bottom: 10px; font-weight: bold; }
        #popup-desc { font-size: 1rem; color: #aaa; margin-bottom: 30px; line-height: 1.5; white-space: pre-wrap; }
        .popup-buttons { display: flex; gap: 10px; justify-content: center; }
        
        #play-screen { background: #1a1a1a; transition: background-color 0.3s; width: 100vw; max-width: none; }
        #skip-btn { position: absolute; top: 20px; right: 20px; color: #ff3366; cursor: pointer; z-index: 100; font-weight: bold; padding: 10px; display: none; }
        #feedback { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.5); transition: transform 0.1s; position: absolute; z-index: 10; pointer-events: none; text-align: center; }
        #combo-display { position: absolute; top: 5%; left: 5%; font-size: 1.5rem; color: #aaa; display: none; }
        #info-text { position: absolute; bottom: 5%; font-size: 1rem; color: #00ffcc; font-weight: bold; text-align: center; width: 100%; pointer-events: none; display: none; }
        
        #tut-dialog { display: none; position: absolute; bottom: 10%; width: 90%; max-width: 500px; background: rgba(0,0,0,0.85); border: 2px solid #00ffcc; border-radius: 10px; padding: 20px; box-sizing: border-box; z-index: 20; pointer-events: none; }
        #tut-text { font-size: clamp(1rem, 4vw, 1.2rem); color: #fff; line-height: 1.6; white-space: pre-wrap; font-weight: bold; text-align: center; }
        #tut-next-hint { font-size: 0.9rem; color: #00ffcc; text-align: right; margin-top: 15px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        #tut-action-ui { display: none; position: absolute; top: 15%; text-align: center; z-index: 20; background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 10px; pointer-events: none; }
        #tut-action-inst { font-size: 1.5rem; color: #fff; font-weight: bold; margin-bottom: 5px; }
        #tut-action-count { font-size: 1.2rem; color: #ffcc00; font-weight: bold; }
        
        #result-rank { font-size: 5rem; font-weight: bold; margin: 10px 0 30px 0; }
        #result-eval { font-size: 1.2rem; color: #fff; margin-bottom: 40px; text-align: center; line-height: 1.6; white-space: pre-wrap; padding: 0 20px; }
    </style>
</head>
<body>
<div id="select-screen" class="screen active">
    <h1>SELECT STAGE</h1>
    <div id="loading-message">楽曲データを読み込み中...</div>
    <div class="song-list" id="song-list-container"></div>
</div>

<div id="popup-overlay">
    <div class="popup-box">
        <div id="popup-title"></div>
        <div id="popup-desc"></div>
        <div class="popup-buttons">
            <div class="btn btn-cancel" id="btn-cancel">戻る</div>
            <div class="btn" id="btn-start">開始</div>
        </div>
    </div>
</div>

<div id="play-screen" class="screen">
    <div id="skip-btn">スキップ ≫</div>
    <div id="combo-display"></div>
    <div id="feedback"></div>
    <div id="info-text"></div>
    <div id="tut-action-ui">
        <div id="tut-action-inst"></div>
        <div id="tut-action-count"></div>
    </div>
    <div id="tut-dialog">
        <div id="tut-text"></div>
        <div id="tut-next-hint">▼ 画面をタップして次へ</div>
    </div>
</div>

<div id="result-screen" class="screen">
    <h2 style="color:#00ffcc;margin:0;">RESULT</h2>
    <div id="result-rank"></div>
    <div id="result-eval"></div>
    <div class="btn" id="btn-retry">選曲に戻る</div>
</div>

<script src="song.js"></script>
<script>
// =============================================
// DOM refs & Global Variables
// =============================================
const selectScreen = document.getElementById('select-screen');
const popupOverlay = document.getElementById('popup-overlay');
const playScreen   = document.getElementById('play-screen');
const resultScreen = document.getElementById('result-screen');
const feedbackEl   = document.getElementById('feedback');
const comboEl      = document.getElementById('combo-display');
const skipBtn      = document.getElementById('skip-btn');
const infoText     = document.getElementById('info-text');

const ST_MENU=0, ST_TUT_TEXT=1, ST_TUT_ACTION=2, ST_PLAY=3;
let gameState       = ST_MENU;
let songDatabase    = [];
let tutorialLibrary = {};
let audioCtx        = null;
let currentSong     = null;
let beatLen=0, measureLen=0, PRE_ROLL_SEC=0;

// 本編用変数
let nodes=[], startTime=0, isPlaying=false;
let combo=0, isPeakFailed=false;
let stats={perfect:0,great:0,good:0,miss:0};

// チュートリアル用変数
let tutScript=[], tutStepIndex=0;
let tutNodes=[], tutPerfectRun=0;
let tutExpected='t';      
let tutScheduledAt=0, tutLastT=0;     
let tutLoopId=null;       
let tutCleared=false;     

// オーディオソース管理
let scheduledAudio = [];
let musicSource = null;

// =============================================
// 起動処理
// =============================================
window.addEventListener('DOMContentLoaded', async () => {
    const loadMsg = document.getElementById('loading-message');

    try {
        const r = await fetch('tutorial1.json?t='+Date.now());
        tutorialLibrary = (await r.json()).scores || {};
    } catch(e){ console.warn('tutorial1.json 読み込み失敗'); }

    if (typeof targetJsonFiles === 'undefined'){
        loadMsg.innerText='song.js が見つかりません'; return;
    }
    
    let n=0;
    for (const f of targetJsonFiles){
        try{
            const r = await fetch(f+'?t='+Date.now());
            if(!r.ok) throw 0;
            const s = await r.json();
            if(!s.comments) s.comments={S:'S',A:'A',B:'B',C:'C',FAILED:'FAILED'};
            songDatabase.push(s); n++;
        }catch(e){ console.warn(f+' 読み込み失敗'); }
    }
    
    loadMsg.style.display='none';
    if(n>0) buildSongList();
    else loadMsg.innerText='楽曲データが見つかりません';
});

function buildSongList(){
    const c=document.getElementById('song-list-container');
    c.innerHTML='';
    songDatabase.forEach(song=>{
        const d=document.createElement('div');
        d.className='song-btn';
        d.innerHTML=`<div class="song-title">${song.title}</div><div class="song-bpm">BPM: ${song.bpm}</div>`;
        d.onclick=()=>openPopup(song);
        c.appendChild(d);
    });
}
function openPopup(song){
    currentSong=song;
    document.getElementById('popup-title').innerText=song.title;
    document.getElementById('popup-desc').innerText=song.desc;
    popupOverlay.style.display='flex';
}
document.getElementById('btn-cancel').onclick=()=>{ popupOverlay.style.display='none'; };

// =============================================
// 音源生成・ダブり防止
// =============================================
function clearAudio() {
    scheduledAudio.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
    scheduledAudio = [];
    if(musicSource) { try { musicSource.stop(); musicSource.disconnect(); } catch(e){} musicSource = null; }
}

function tone(freq,time,type='sine',vol=0.1,dur=0.1){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+dur);
    o.start(time); o.stop(time+dur);
    scheduledAudio.push(o); 
}
const guideNote =(t)=>tone(659.25,t,'triangle',0.15,0.15);
const targetNote=(t)=>tone(523.25,t,'triangle',0.20,0.20);
const hitSound  =()=>{ if(audioCtx) tone(150,audioCtx.currentTime,'square',0.1,0.05); };

function scheduleMetronome(toSec, baseTime){
    for(let t=0; t < toSec - 0.01; t+=beatLen){
        const abs=baseTime+t;
        const beat=Math.round(t/beatLen)%4;
        tone(beat===0?1200:600, abs,'square', beat===0?0.1:0.06, 0.05);
    }
}

// =============================================
// ゲーム開始＆音楽ファイル読み込み
// =============================================
document.getElementById('btn-start').onclick = async (e) => {
    e.stopPropagation();
    popupOverlay.style.display='none';
    selectScreen.classList.remove('active');
    playScreen.classList.add('active');

    beatLen      = 60/currentSong.bpm;
    measureLen   = beatLen*4;
    PRE_ROLL_SEC = measureLen;

    comboEl.style.display='none';
    infoText.style.display='none';
    playScreen.style.backgroundColor='#1a1a1a';
    feedbackEl.innerText='';

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    clearAudio(); 

    // JSONに "audio" 指定があれば開始前に読み込む
    const audioUrl = currentSong.audio || currentSong.audioFile;
    if (audioUrl && !currentSong.audioBuffer) {
        infoText.style.display='block';
        infoText.innerText='Loading Music...';
        try {
            const res = await fetch(audioUrl);
            const buf = await res.arrayBuffer();
            currentSong.audioBuffer = await audioCtx.decodeAudioData(buf);
        } catch(err) {
            console.warn("音楽ファイルの読み込みに失敗しました", err);
        }
        infoText.style.display='none';
    }

    if(currentSong.tutorial) {
        skipBtn.style.display = 'block';
        startTutorial();
    } else {
        skipBtn.style.display = 'none';
        startGame();
    }
};

skipBtn.onclick = (e) => {
    e.stopPropagation();
    if(tutLoopId) { cancelAnimationFrame(tutLoopId); tutLoopId=null; }
    clearAudio(); 
    document.getElementById('tut-dialog').style.display='none';
    document.getElementById('tut-action-ui').style.display='none';
    skipBtn.style.display = 'none';
    startGame();
};

// =============================================
// チュートリアル
// =============================================
function startTutorial(){
    let raw = currentSong.tutorial.replace(/[￥\\]/g, '¥');
    const tokens = raw.split(/(¥[^¥]+¥)/);
    tutScript = [];
    let textBuf = '';

    const flushText = () => {
        const t = textBuf.trim();
        if (t) tutScript.push({ type: 'text', text: t });
        textBuf = '';
    };

    tokens.forEach(tok => {
        if (!tok) return;
        const match = tok.match(/^¥([^¥]+)¥$/);
        if (match) {
            const tag = match[1].trim(); 
            if (tag.toLowerCase() === 'a') {
                flushText();
            } else if (/^[A-Za-z][0-9]$/.test(tag)) {
                flushText();
                tutScript.push({ type: 'action', id: tag.toUpperCase() });
            }
        } else {
            textBuf += tok; 
        }
    });
    flushText(); 

    tutStepIndex=0;
    setTimeout(nextTutStep, 100);
}

function nextTutStep(){
    document.getElementById('tut-dialog').style.display='none';
    document.getElementById('tut-action-ui').style.display='none';
    feedbackEl.innerText='';

    if(tutStepIndex>=tutScript.length){ 
        skipBtn.style.display = 'none';
        startGame(); 
        return; 
    }

    const step=tutScript[tutStepIndex++];
    if(step.type==='text'){
        gameState=ST_TUT_TEXT;
        document.getElementById('tut-text').innerText=step.text;
        document.getElementById('tut-dialog').style.display='block';
        playScreen.style.backgroundColor='#1a1a1a';
    } else {
        gameState=ST_TUT_ACTION;
        launchTutAction(step.id);
    }
}

function parseTutNodes(scoreStr){
    const result=[];
    scoreStr.split(',').forEach(s=>{
        s=s.trim(); if(!s) return;
        let type='t';
        if(s.startsWith('2t')){ type='2t'; s=s.slice(2); }
        else if(s.startsWith('s')){ type='s'; s=s.slice(1); }
        else if(s.startsWith('t')){ type='t'; s=s.slice(1); }
        const n=s.split('.').map(Number);
        if(n.length===3){
            const timingSec=PRE_ROLL_SEC+(n[0]-1)*measureLen+(n[2]-1)/n[1]*measureLen;
            result.push({type,timingSec,judged:false});
        }
    });
    return result;
}

function launchTutAction(actionId){
    const scoreStr = tutorialLibrary[actionId] || 't2.4.1,t3.4.1,t4.4.1,t5.4.1';
    let typeLabel = "TAP";
    if(scoreStr.includes("2t")) { typeLabel = "2本指TAP"; tutExpected = "2t"; }
    else if(scoreStr.includes("s")) { typeLabel = "SWIPE"; tutExpected = "s"; }
    else { typeLabel = "TAP"; tutExpected = "t"; }

    document.getElementById('tut-action-inst').innerText=`${typeLabel}の練習`;
    tutPerfectRun = 0; 
    scheduleTutRound(scoreStr, 0); 
}

function scheduleTutRound(scoreStr, exactStartTime){
    if(tutLoopId){ cancelAnimationFrame(tutLoopId); tutLoopId=null; }
    tutNodes=parseTutNodes(scoreStr);
    
    if (exactStartTime) { tutScheduledAt = exactStartTime; } 
    else { tutScheduledAt = audioCtx.currentTime; }

    tutLastT = tutNodes[tutNodes.length-1].timingSec + measureLen;
    
    // チュートリアルはメトロノーム絶対ON
    scheduleMetronome(tutLastT, tutScheduledAt);

    tutNodes.forEach(node=>{
        const abs=tutScheduledAt+node.timingSec;
        const gAbs=abs-beatLen;
        if(gAbs>audioCtx.currentTime) guideNote(gAbs);
        targetNote(abs);
    });

    updateTutUI();
    document.getElementById('tut-action-ui').style.display='block';
    tutLoopId=requestAnimationFrame(tutMissLoop);
}

function tutMissLoop(){
    if(gameState!==ST_TUT_ACTION) return;
    if(tutCleared) return; 

    const elapsed=audioCtx.currentTime-tutScheduledAt;

    tutNodes.forEach(node=>{
        if(node.judged) return;
        if(elapsed > node.timingSec+0.150){
            node.judged=true;
            tutPerfectRun=0;
            showFeedback('MISS','#555');
            updateTutUI();
        }
    });

    const done=tutNodes.every(n=>n.judged);
    if(done){
        if(tutPerfectRun<4){
            if(elapsed >= tutLastT){
                if(gameState===ST_TUT_ACTION && !tutCleared){
                    const prevStep=tutScript[tutStepIndex-1];
                    const sc=tutorialLibrary[prevStep.id]||'t2.4.1,t3.4.1,t4.4.1,t5.4.1';
                    tutNodes.forEach(n=>n.judged=false);
                    scheduleTutRound(sc, tutScheduledAt + tutLastT);
                }
                return;
            }
        }
    }
    tutLoopId=requestAnimationFrame(tutMissLoop);
}

function updateTutUI(){
    const colors=['#1a1a1a','#3a3a00','#003a00','#002244','#3a0000'];
    playScreen.style.backgroundColor=colors[Math.min(tutPerfectRun,colors.length-1)];
    document.getElementById('tut-action-count').innerText=`連続Perfect: ${tutPerfectRun} / 4`;
}

function handleTutAction(inputType){
    const elapsed=audioCtx.currentTime-tutScheduledAt;
    let target=null, minDev=Infinity;
    
    tutNodes.forEach(node=>{
        if(node.judged) return;
        const dev=Math.abs(elapsed-node.timingSec);
        if(dev<minDev && dev<=0.300){ minDev=dev; target=node; }
    });
    if(!target) return;

    target.judged=true;
    hitSound();
    const devMs=minDev*1000;

    if(inputType!==tutExpected){
        showFeedback('操作ミス！','#ff3366');
        tutPerfectRun=0;
    } else if(devMs<=40){
        showFeedback('PERFECT','#ffcc00');
        tutPerfectRun++;
    } else if(devMs<=100){
        showFeedback('GREAT','#00ffcc');
        tutPerfectRun=0;
    } else if(devMs<=150){
        showFeedback('GOOD','#00ccff');
        tutPerfectRun=0;
    } else {
        showFeedback('MISS','#555');
        tutPerfectRun=0;
    }

    updateTutUI();

    if(tutPerfectRun>=4){
        tutCleared = true;
        if(tutLoopId){ cancelAnimationFrame(tutLoopId); tutLoopId=null; }
        tone(1000,audioCtx.currentTime,'sine',0.1,0.2);
        tone(1500,audioCtx.currentTime+0.2,'sine',0.1,0.4);
        
        setTimeout(()=>{
            clearAudio();
            feedbackEl.innerText='';
            tutCleared = false; 
            nextTutStep();
        },800);
    }
}

// =============================================
// 本編 (STAGE)
// =============================================
function parseMainNodes(scoreStr){
    const result=[];
    scoreStr.split(',').forEach((s,idx)=>{
        s=s.trim(); if(!s) return;
        let isPeak=false;
        if(s.startsWith('p')){ isPeak=true; s=s.slice(1); }
        let type='t';
        if(s.startsWith('2t')){ type='2t'; s=s.slice(2); }
        else if(s.startsWith('s')){ type='s'; s=s.slice(1); }
        else if(s.startsWith('t')){ type='t'; s=s.slice(1); }
        const n=s.split('.').map(Number);
        if(n.length===3){
            const timingSec=PRE_ROLL_SEC+(n[0]-1)*measureLen+(n[2]-1)/n[1]*measureLen;
            result.push({idx,type,isPeak,timingSec,judged:false});
        }
    });
    return result;
}

function startGame(){
    if(tutLoopId){ cancelAnimationFrame(tutLoopId); tutLoopId=null; }
    clearAudio(); 
    gameState=ST_PLAY;

    playScreen.style.backgroundColor='#1a1a1a';
    playScreen.style.boxShadow='none';
    comboEl.style.display='block'; comboEl.innerText='';
    infoText.style.display='block'; infoText.innerText='本番スタート！';
    feedbackEl.innerText='';

    nodes=parseMainNodes(currentSong.score);
    startTime=audioCtx.currentTime;
    isPlaying=true; isPeakFailed=false; combo=0;
    stats={perfect:0,great:0,good:0,miss:0};

    const lastT=nodes.reduce((m,n)=>Math.max(m,n.timingSec),0)+2.0;

    // 音楽ファイルが読み込めていれば再生
    let hasMusic = !!currentSong.audioBuffer;
    if(hasMusic) {
        musicSource = audioCtx.createBufferSource();
        musicSource.buffer = currentSong.audioBuffer;
        musicSource.connect(audioCtx.destination);
        musicSource.start(startTime + PRE_ROLL_SEC);
    }

    // メトロノームの設定確認
    let isMetroOn = false;
    let metroVal = currentSong.Metro || currentSong.metro || currentSong.metronome;
    if (metroVal === true || (typeof metroVal === 'string' && metroVal.trim().toLowerCase() === 'on')) {
        isMetroOn = true;
    }

    // 「音楽がない」 または 「メトロノームON設定」 の場合はメトロノームを鳴らす
    if(!hasMusic || isMetroOn) {
        scheduleMetronome(lastT, startTime);
    }

    nodes.forEach(node=>{
        const abs=startTime+node.timingSec;
        const g=abs-beatLen;
        if(g>=startTime) guideNote(g);
        targetNote(abs);
    });

    (function loop(){
        if(!isPlaying||gameState!==ST_PLAY) return;
        const el=audioCtx.currentTime-startTime;
        nodes.forEach(node=>{
            if(!node.judged && el>node.timingSec+0.150){
                node.judged=true; stats.miss++; combo=0; updateCombo();
                showFeedback('MISS','#555');
                if(node.isPeak) isPeakFailed=true;
            }
        });
        if(el>lastT){ endGame(); return; }
        requestAnimationFrame(loop);
    })();
}

function handlePlayAction(inputType){
    if(!isPlaying) return;
    hitSound();
    const el=audioCtx.currentTime-startTime;
    let target=null,minDev=Infinity;
    nodes.forEach(node=>{
        if(node.judged) return;
        const dev=Math.abs(el-node.timingSec);
        if(dev<minDev&&dev<=0.300){ minDev=dev; target=node; }
    });
    if(!target) return;
    target.judged=true;

    const devMs=minDev*1000;
    let txt='',col='',ok=false;
    if(inputType!==target.type){
        txt='操作ミス'; col='#ff3366'; stats.miss++; combo=0;
    } else if(devMs<=40) { txt='PERFECT';col='#ffcc00';stats.perfect++;ok=true;combo++; }
    else if(devMs<=100)  { txt='GREAT';  col='#00ffcc';stats.great++;  ok=true;combo++; }
    else if(devMs<=150)  { txt='GOOD';   col='#00ccff';stats.good++;   combo=0; }
    else                 { txt='MISS';   col='#555';   stats.miss++;   combo=0; }

    if(target.isPeak){ txt+=' (PEAK)'; if(!ok) isPeakFailed=true; }
    updateCombo(); showFeedback(txt,col);
}

// =============================================
// ゲーム終了とUI処理
// =============================================
function endGame(){
    isPlaying=false; gameState=ST_MENU;
    clearAudio();
    if(audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; }
    playScreen.classList.remove('active');
    resultScreen.classList.add('active');

    const total=nodes.length;
    const mistakes = stats.miss + stats.good;
    const allowedMisses = Math.max(3, Math.floor(total * 0.05));

    const avg=total>0?Math.floor((stats.perfect*100+stats.great*70+stats.good*30)/total):0;
    const rEl=document.getElementById('result-rank');
    const eEl=document.getElementById('result-eval');
    const c=currentSong.comments || {};

    let rank = '';
    if (!isPeakFailed && mistakes <= allowedMisses) {
        rank = 'S';
    } else {
        if (avg >= 80) rank = 'A';
        else if (avg >= 60) rank = 'B';
        else rank = 'C';
    }

    if(rank === 'S') { 
        rEl.innerText='S'; rEl.style.color='#ffcc00'; 
        eEl.innerText=c.S; 
    }
    else if(rank === 'A') { 
        rEl.innerText='A'; rEl.style.color='#00ffcc'; 
        eEl.innerText=isPeakFailed && c.FAILED ? c.FAILED : c.A; 
    }
    else if(rank === 'B') { 
        rEl.innerText='B'; rEl.style.color='#00ccff'; 
        eEl.innerText=isPeakFailed && c.FAILED ? c.FAILED : c.B; 
    }
    else { 
        rEl.innerText='C'; rEl.style.color='#aaa'; 
        eEl.innerText=isPeakFailed && c.FAILED ? c.FAILED : c.C; 
    }
}

document.getElementById('btn-retry').onclick=()=>{
    clearAudio(); 
    resultScreen.classList.remove('active');
    selectScreen.classList.add('active');
    currentSong=null;
};

function showFeedback(txt,col){
    feedbackEl.innerText=txt; feedbackEl.style.color=col;
    feedbackEl.style.transform='scale(1.2)';
    setTimeout(()=>feedbackEl.style.transform='scale(1)',100);
}
function updateCombo(){
    comboEl.innerText=combo>1?`Combo: ${combo}`:'';

    if (gameState === ST_PLAY) {
        if (combo >= 30) {
            playScreen.style.backgroundColor = '#332200';
            playScreen.style.boxShadow = 'inset 0 0 50px #ffcc00';
        } else if (combo >= 20) {
            playScreen.style.backgroundColor = '#3a0000';
            playScreen.style.boxShadow = 'none';
        } else if (combo >= 10) {
            playScreen.style.backgroundColor = '#002244';
            playScreen.style.boxShadow = 'none';
        } else {
            playScreen.style.backgroundColor = '#1a1a1a';
            playScreen.style.boxShadow = 'none';
        }
    }
}

// =============================================
// 入力検出 (タップ・スワイプ判定)
// =============================================
let sx=0,sy=0,touchCnt=0,detType='t',isTD=false,mouseDown=false;

playScreen.addEventListener('touchstart',e=>{
    isTD=true; e.preventDefault();
    if (e.target.id === 'skip-btn') return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    touchCnt=e.touches.length; detType='t';
},{passive:false});
playScreen.addEventListener('touchmove',e=>{
    if(touchCnt===1){
        const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
        if(Math.sqrt(dx*dx+dy*dy)>50) detType='s';
    }
},{passive:false});
playScreen.addEventListener('touchend',e=>{
    if (e.target.id === 'skip-btn') return;
    if(e.touches.length>0) return;
    const t=touchCnt>=2?'2t':detType;
    processInput(t);
    detType='t'; touchCnt=0;
},{passive:false});

playScreen.addEventListener('mousedown',e=>{ 
    if(isTD || e.target.id === 'skip-btn') return; 
    mouseDown=true; sx=e.clientX;sy=e.clientY;detType='t'; 
});
playScreen.addEventListener('mousemove',e=>{ 
    if(!mouseDown) return; 
    const dx=e.clientX-sx,dy=e.clientY-sy; 
    if(Math.sqrt(dx*dx+dy*dy)>50) detType='s'; 
});
playScreen.addEventListener('mouseup',  e=>{ 
    if(!mouseDown || e.target.id === 'skip-btn') return; 
    mouseDown=false; processInput(detType); 
});

function processInput(type){
    if     (gameState===ST_TUT_TEXT)   nextTutStep(); 
    else if(gameState===ST_TUT_ACTION) handleTutAction(type);
    else if(gameState===ST_PLAY)       handlePlayAction(type);
}
</script>
